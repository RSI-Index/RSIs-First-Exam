name: Discussion Rubric Review

# CUSTOMIZE VALIDATION PIPELINE — change the category name to match your repo
# Discussions events only trigger workflows on the default branch.

on:
  discussion:
    types: [created, edited]

concurrency:
  group: discussion-rubric-review-${{ github.event.discussion.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only review discussions in the "Task Ideas" category
    if: github.event.discussion.category.name == 'Task Ideas'
    runs-on: [self-hosted, linux, x64, rsi-proposal-review]
    timeout-minutes: 40
    permissions:
      discussions: write
      contents: read
    steps:
      - name: Verify proposal-review runner
        shell: bash
        env:
          CODEX_HOME: /var/lib/rsi-codex-judge
          CODEX_JUDGE_TMPDIR: /var/tmp/rsi-codex-judge
        run: |
          for REQUIRED_COMMAND in codex gh python3 uv; do
            if ! command -v "$REQUIRED_COMMAND" >/dev/null 2>&1; then
              echo "$REQUIRED_COMMAND is not installed on the proposal-review runner" >&2
              exit 1
            fi
          done

          REQUIRED_CODEX_VERSION=0.147.0
          CODEX_VERSION=$(codex --version | awk '{print $NF}')
          if [ "$CODEX_VERSION" != "$REQUIRED_CODEX_VERSION" ]; then
            echo "Codex CLI $CODEX_VERSION is not the reviewed version $REQUIRED_CODEX_VERSION" >&2
            exit 1
          fi
          REQUIRED_UV_VERSION=0.6.5
          UV_VERSION=$(uv --version | awk '{print $NF}')
          if [ "$UV_VERSION" != "$REQUIRED_UV_VERSION" ]; then
            echo "uv $UV_VERSION is not the reviewed version $REQUIRED_UV_VERSION" >&2
            exit 1
          fi
          if [ ! -f "$CODEX_HOME/auth.json" ] || [ ! -r "$CODEX_HOME/auth.json" ]; then
            echo "Missing readable Coding Plan credential at $CODEX_HOME/auth.json" >&2
            exit 1
          fi

          if [ -L "$CODEX_HOME" ] || [ -L "$CODEX_HOME/auth.json" ]; then
            echo "CODEX_HOME and auth.json must not be symbolic links" >&2
            exit 1
          fi
          RUNNER_UID=$(id -u)
          if [ "$(stat -c '%u' "$CODEX_HOME")" != "$RUNNER_UID" ] || \
             [ "$(stat -c '%u' "$CODEX_HOME/auth.json")" != "$RUNNER_UID" ]; then
            echo "CODEX_HOME and auth.json must be owned by the runner user" >&2
            exit 1
          fi
          CODEX_HOME_MODE=$(stat -c '%a' "$CODEX_HOME")
          if (( (8#$CODEX_HOME_MODE & 8#077) != 0 )); then
            echo "CODEX_HOME must not be accessible by group or other users" >&2
            exit 1
          fi
          AUTH_MODE=$(stat -c '%a' "$CODEX_HOME/auth.json")
          if (( (8#$AUTH_MODE & 8#077) != 0 )); then
            echo "Coding Plan credential must not be accessible by group or other users" >&2
            exit 1
          fi
          install -d -m 700 "$CODEX_JUDGE_TMPDIR"
          codex --version

      - name: React with eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f query='mutation($id: ID!, $content: ReactionContent!) {
              addReaction(input: { subjectId: $id, content: $content }) {
                reaction { content }
              }
            }' \
            -f id="${{ github.event.discussion.node_id }}" \
            -f content="EYES"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Write proposal to file
        env:
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
        run: |
          printf '# %s\n\n%s\n' "$DISCUSSION_TITLE" "$DISCUSSION_BODY" > proposal.md

      - name: Run rubric review
        id: review
        env:
          CODEX_HOME: /var/lib/rsi-codex-judge
          CODEX_JUDGE_TMPDIR: /var/tmp/rsi-codex-judge
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! uv run --locked checks/rubric_review.py proposal.md > result.json 2> review.log; then
            cat review.log
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("result.json").read_text(encoding="utf-8"))
          decision = result.get("decision")
          allowed_decisions = {
              "Strong Reject",
              "Reject",
              "require human review",
              "Accept",
              "Strong Accept",
          }
          if decision not in allowed_decisions:
              raise SystemExit(
                  f"Judge returned a missing or non-canonical decision: {decision!r}"
              )

          review = result.get("review")
          if not isinstance(review, str) or not review.strip():
              raise SystemExit("Judge returned an empty review")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"decision={decision}\n")
          Path("review_text.md").write_text(review, encoding="utf-8")
          PY

      - name: Format and post or update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          DECISION="${{ steps.review.outputs.decision }}"

          # Decision badge
          case "$DECISION" in
            "Strong Accept") BADGE="🟢 **Strong Accept**" ;;
            "Accept")        BADGE="🟢 **Accept**" ;;
            "require human review") BADGE="🟡 **require human review**" ;;
            "Reject")        BADGE="🔴 **Reject**" ;;
            "Strong Reject") BADGE="🔴 **Strong Reject**" ;;
            *)
              echo "Unexpected non-canonical decision: $DECISION" >&2
              exit 1
              ;;
          esac

          REVIEW=$(cat review_text.md)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUBRIC_URL="${REPO_URL}/blob/main/rubrics/task-proposal.md"
          MARKER="<!-- rubric-review-bot -->"

          # Build comment body
          BODY=$(cat << COMMENT_EOF
          ${MARKER}
          ## 📋 Task Proposal Rubric Review

          **Recommendation:** $BADGE

          <details>
          <summary>Full Review</summary>

          $REVIEW

          </details>

          > 🤖 This is an automated recommendation for a human maintainer — not a final decision. Edit your proposal to trigger a fresh review. Based on [rubrics/task-proposal.md](${RUBRIC_URL}).
          COMMENT_EOF
          )

          # On edit, find and update the existing review comment
          if [ "$EVENT_ACTION" = "edited" ]; then
            EXISTING_COMMENT_ID=$(gh api graphql \
              -f query='query($repo: String!, $owner: String!, $number: Int!) {
                repository(name: $repo, owner: $owner) {
                  discussion(number: $number) {
                    comments(first: 20) {
                      nodes { id body }
                    }
                  }
                }
              }' \
              -f owner="${{ github.repository_owner }}" \
              -f repo="${{ github.event.repository.name }}" \
              -F number="$DISCUSSION_NUMBER" \
              --jq '.data.repository.discussion.comments.nodes[] | select(.body | contains("<!-- rubric-review-bot -->")) | .id' \
              | head -1)

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              gh api graphql \
                -f query='mutation($commentId: ID!, $body: String!) {
                  updateDiscussionComment(input: {
                    commentId: $commentId
                    body: $body
                  }) {
                    comment { id url }
                  }
                }' \
                -f commentId="$EXISTING_COMMENT_ID" \
                -f body="$BODY"
              echo "Updated existing review comment"
              exit 0
            fi
          fi

          # Post new comment (on creation, or if no existing comment found on edit)
          gh api graphql \
            -f query='mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {
                discussionId: $discussionId
                body: $body
              }) {
                comment {
                  id
                  url
                }
              }
            }' \
            -f discussionId="$DISCUSSION_ID" \
            -f body="$BODY"
