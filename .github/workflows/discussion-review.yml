name: Discussion Rubric Review

# CUSTOMIZE VALIDATION PIPELINE — change the category name to match your repo
# Discussions events only trigger workflows on the default branch.

on:
  discussion:
    types: [created, edited]

jobs:
  review:
    # Only review discussions in the "Task Ideas" category
    if: github.event.discussion.category.name == 'Task Ideas'
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      contents: read
    steps:
      - name: React with eyes
        env:
          GH_TOKEN: ${{ secrets.DISCUSSION_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
        run: |
          gh api graphql \
            -f query='mutation($id: ID!, $content: ReactionContent!) {
              addReaction(input: { subjectId: $id, content: $content }) {
                reaction { content }
              }
            }' \
            -f id="$DISCUSSION_NODE_ID" \
            -f content="EYES"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Create private Skills read token
        id: skills-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RSI_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RSI_DISPATCH_APP_PRIVATE_KEY }}
          owner: RSI-Index
          repositories: RSI-Skills
          permission-contents: read

      # The proposal rubric is private: it is fetched from the organization-only
      # Skills repository per run instead of living in the public tree.
      - name: Checkout private discussion rubric
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: RSI-Index/RSI-Skills
          ref: main
          token: ${{ steps.skills-token.outputs.token }}
          path: private-skills
          sparse-checkout: rubrics/task-proposal.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a

      - name: Write proposal to file
        env:
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
        run: |
          printf '# %s\n\n%s\n' "$DISCUSSION_TITLE" "$DISCUSSION_BODY" > proposal.md

      - name: Run rubric review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUBRIC_FILE: ${{ github.workspace }}/private-skills/rubrics/task-proposal.md
        run: |
          if ! uv run checks/rubric_review.py proposal.md > result.json 2> review.log; then
            cat review.log
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("result.json").read_text(encoding="utf-8"))
          decision = result.get("decision")
          allowed_decisions = {
              "Strong Reject",
              "Reject",
              "require human review",
              "Accept",
              "Strong Accept",
          }
          if decision not in allowed_decisions:
              raise SystemExit(
                  f"Judge returned a missing or non-canonical decision: {decision!r}"
              )

          review = result.get("review")
          if not isinstance(review, str) or not review.strip():
              raise SystemExit("Judge returned an empty review")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"decision={decision}\n")
          Path("review_text.md").write_text(review, encoding="utf-8")
          PY

      - name: Render canonical proposal review marker
        id: marker
        env:
          DECISION: ${{ steps.review.outputs.decision }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
        run: |
          marker=$(python3 checks/proposal_review_marker.py)
          printf 'marker=%s\n' "$marker" >> "$GITHUB_OUTPUT"

      - name: Format and post or update comment
        env:
          GH_TOKEN: ${{ secrets.DISCUSSION_TOKEN }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_MARKER: ${{ steps.marker.outputs.marker }}
          DECISION: ${{ steps.review.outputs.decision }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # Decision badge
          case "$DECISION" in
            "Strong Accept") BADGE="🟢 **Strong Accept**" ;;
            "Accept")        BADGE="🟢 **Accept**" ;;
            "require human review") BADGE="🟡 **require human review**" ;;
            "Reject")        BADGE="🔴 **Reject**" ;;
            "Strong Reject") BADGE="🔴 **Strong Reject**" ;;
            *)
              echo "Unexpected non-canonical decision: $DECISION" >&2
              exit 1
              ;;
          esac

          REVIEW=$(cat review_text.md)
          BOT_MARKER="<!-- rubric-review-bot -->"

          case "$DECISION" in
            "Strong Accept"|"Accept")
              NEXT_STEP="> 🤖 This automated recommendation is eligible for task dispatch. As the Discussion author, send \`/task\` to continue."
              ;;
            *)
              NEXT_STEP="> 🤖 This is an automated recommendation for a human maintainer — not a final decision. Edit your proposal to trigger a fresh review. Judged against the private task proposal rubric; ask a maintainer if a point is unclear."
              ;;
          esac

          # Build comment body
          BODY=$(cat << COMMENT_EOF
          ${BOT_MARKER}
          ${REVIEW_MARKER}
          ## 📋 Task Proposal Rubric Review

          **Recommendation:** $BADGE

          <details>
          <summary>Full Review</summary>

          $REVIEW

          </details>

          $NEXT_STEP
          COMMENT_EOF
          )

          # On edit, find and update the existing review comment
          if [ "$EVENT_ACTION" = "edited" ]; then
            EXISTING_COMMENT_ID=$(gh api graphql \
              -f query='query($repo: String!, $owner: String!, $number: Int!, $endCursor: String) {
                repository(name: $repo, owner: $owner) {
                  discussion(number: $number) {
                    comments(first: 100, after: $endCursor) {
                      nodes { id body }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
              -f owner="$REPOSITORY_OWNER" \
              -f repo="$REPOSITORY_NAME" \
              -F number="$DISCUSSION_NUMBER" \
              --paginate --slurp \
              --jq '[.[].data.repository.discussion.comments.nodes[] | select(.body | contains("<!-- rubric-review-bot -->")) | .id] | .[0] // empty')

            if [ -n "$EXISTING_COMMENT_ID" ]; then
              gh api graphql \
                -f query='mutation($commentId: ID!, $body: String!) {
                  updateDiscussionComment(input: {
                    commentId: $commentId
                    body: $body
                  }) {
                    comment { id url }
                  }
                }' \
                -f commentId="$EXISTING_COMMENT_ID" \
                -f body="$BODY"
              echo "Updated existing review comment"
              exit 0
            fi
          fi

          # Post new comment (on creation, or if no existing comment found on edit)
          gh api graphql \
            -f query='mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {
                discussionId: $discussionId
                body: $body
              }) {
                comment {
                  id
                  url
                }
              }
            }' \
            -f discussionId="$DISCUSSION_ID" \
            -f body="$BODY"
