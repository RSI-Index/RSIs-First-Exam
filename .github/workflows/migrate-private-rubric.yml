name: One-time private rubric migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private rubric
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Zhuofeng-Li/RSI-Index-Rubrics
          ref: main
          token: ${{ secrets.RUBRIC_REPO_TOKEN }}
          path: source-rubric
          sparse-checkout: task-proposal.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Create Skills migration token
        id: skills-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RSI_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RSI_DISPATCH_APP_PRIVATE_KEY }}
          owner: RSI-Index
          repositories: RSI-Skills
          permission-contents: write

      - name: Checkout Skills main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: RSI-Index/RSI-Skills
          ref: main
          token: ${{ steps.skills-token.outputs.token }}
          path: target-skills
          persist-credentials: false

      - name: Migrate exact rubric bytes
        env:
          RSI_SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
        run: |
          set -euo pipefail

          source=source-rubric/task-proposal.md
          target=target-skills/rubrics/task-proposal.md
          branch=automation/migrate-task-proposal-rubric

          test -f "$source"
          test ! -L "$source"
          size=$(wc -c < "$source")
          test "$size" -gt 0
          test "$size" -le 1048576

          source_commit=$(git -C source-rubric rev-parse HEAD)
          if test "${#source_commit}" -ne 40; then
            echo "Invalid source commit" >&2
            exit 1
          fi
          case "$source_commit" in
            *[!0-9a-f]*)
              echo "Invalid source commit" >&2
              exit 1
              ;;
          esac
          source_sha256=$(sha256sum "$source" | cut -d ' ' -f 1)

          install -d target-skills/rubrics
          install -m 0644 "$source" "$target"
          cmp --silent "$source" "$target"

          git -C target-skills checkout -b "$branch"
          git -C target-skills config user.name "rsi-index-task-dispatcher[bot]"
          git -C target-skills config user.email "rsi-index-task-dispatcher[bot]@users.noreply.github.com"
          git -C target-skills add -- rubrics/task-proposal.md
          git -C target-skills diff --cached --quiet && {
            echo "Expected a new rubric migration commit" >&2
            exit 1
          }
          git -C target-skills commit -m "chore: import task proposal rubric" \
            -m "Source commit: $source_commit" \
            -m "Source SHA-256: $source_sha256"

          askpass="$RUNNER_TEMP/rsi-rubric-migration-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "$RSI_SKILLS_TOKEN"' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C target-skills push origin "HEAD:refs/heads/$branch"

          {
            echo "### Private rubric migrated"
            printf -- '- Source commit: `%s`\n' "$source_commit"
            printf -- '- Source SHA-256: `%s`\n' "$source_sha256"
            printf -- '- Target branch: `%s`\n' "$branch"
          } >> "$GITHUB_STEP_SUMMARY"
