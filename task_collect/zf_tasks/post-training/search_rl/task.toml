schema_version = "1.3"
source = "OSU-NLP-Group/QUEST@962e10b6b99f53efc8fd45229ed80728b9ee9a05 (evaluation/ redacted)"
artifacts = ["/app/project", "/app/output"]

[task]
name = "more-task/search-rl"
description = "Discover an RL-only continuation of QUEST-35B MT+SFT that beats the official QUEST-35B-RL checkpoint on both hidden BrowseComp and HLE-Text subsets."
authors = [{ name = "More Task" }]
keywords = ["quest", "reinforcement-learning", "deep-research", "layer1"]

[metadata]
category = "model_development"
difficulty = "expert"
upstream_commit = "962e10b6b99f53efc8fd45229ed80728b9ee9a05"
release_state = "layer1-portable"

[metadata.taskgen]
generator = "formulate-harbor-task-from-paper"
instruction_contract = "scientific-harbor-v1"
template_version = "1"
state = "formulated"
layer = "layer1"
cluster_validation = "not-run"

[metadata.optimization]
metric = "mean final BrowseComp and HLE-Text accuracy, gated on strict improvement over QUEST-35B-RL on both"
direction = "higher"
submission_mode = "artifact"
scientific_validation = "external-unverified"

[metadata.full_run]
gpus_per_experiment = 32
total_gpus = 256
gpu_type = "H100"
research_wall_clock_hours = 24
maximum_gpu_hours = 6144
evaluation_examples_per_benchmark = 130
runs_per_example = 3

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0

[environment.env]
TASK_VALIDATION_MODE = "layer1-smoke"
TASK_PROJECT = "/app/project"
TASK_OUTPUT_ROOT = "/app/output"
TASK_TOOLS_ROOT = "/task-tools"

[verifier]
timeout_sec = 300.0

[verifier.env]
TASK_VALIDATION_MODE = "layer1-smoke"
TASK_PROJECT = "/app/project"
TASK_OUTPUT_ROOT = "/app/output"
TASK_TESTS_ROOT = "/tests"
VERIFIER_LOGS_ROOT = "/logs/verifier"

[solution.env]
TASK_VALIDATION_MODE = "layer1-smoke"
