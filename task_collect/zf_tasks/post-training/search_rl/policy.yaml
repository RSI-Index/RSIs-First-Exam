workspace_root: /app/project
allowed_source_globs:
  - "**"
protected_container_paths:
  - /tests/**
  - /solution/**
  - /task-tools/**
  - /logs/verifier/**
constraints:
  starting_model: osunlp/QUEST-35B-MT-Plus-SFT@a15c5e088bac3410f5918480d2dec47fb4b28789
  reference_model: osunlp/QUEST-35B-RL@cfe1bd34132816e76bbbd338cddfcef8ba289c1c
