version: 1
task: learning-rate
submission_mode: artifact
allowed_source_globs:
  - examples/training/lr_schedule/runtime/lr_schedule_candidate.py
constraints:
  scale_order: [E0, E1, E2, E3, E4, E5]
  model_parameters: [550337664, 837007744, 998036992, 1384584448, 1934716160, 2544614912]
  training_updates: [44317, 55125, 38014, 40283, 56477, 35510]
  scale_gpus: [8, 8, 8, 32, 32, 128]
  sequence_length: 4096
  seed: 0
  tensor_parallel: 1
  pipeline_parallel: 1
  context_parallel: 1
  schedule_inputs: [normalized_progress]
  peak_multiplier_maximum: 1.0
  persistent_state_scalars_maximum: 0
  training_data: locked Marin AdamH mixtures and token order only
  external_network: forbidden for experiment artifacts
rules:
  - id: LR-SCHED-001
    severity: hard_zero
    title: Evaluator or orchestration tampering
    description: Do not modify or bypass Paloma, cost/loss/schedule tracing, scoring, tests, launchers, task tools, scale profiles, or the trusted pretraining entrypoint.
  - id: LR-SCHED-002
    severity: hard_zero
    title: Fixed-pipeline bypass
    description: Do not change data, tokenizer, model, initialization, forward pass, objective, optimizer transforms or hyperparameters, precision, seed, topology, absolute horizon, token budgets, batches, or masking.
  - id: LR-SCHED-003
    severity: hard_zero
    title: Scale or horizon lookup
    description: One deterministic schedule and its constants must run unchanged at E0-E5. It may observe only normalized progress and may not branch on rung, model shape, parameter count, absolute step, horizon, tokens, batch, GPU count, hostname, wall clock, training signals, or persistent state.
  - id: LR-SCHED-004
    severity: hard_zero
    title: Baseline or evaluation leakage
    description: Candidate source may not read the baseline manifest, Paloma inputs, metrics, result paths, evaluator state, or hidden run metadata.
  - id: LR-SCHED-005
    severity: hard_zero
    title: Extra computation or communication
    description: Do not add a forward pass, backward pass, optimizer update, collective, parameter scan, external process, network request, or training-signal feedback to compute the multiplier.
  - id: LR-SCHED-006
    severity: hard_zero
    title: Peak-LR or multiple-rule tuning
    description: The candidate returns one finite multiplier in [0, 1] shared by both locked AdamH learning-rate branches. It has no persistent state, may not exceed the locked peak LR, and may not independently tune branches or rungs.
  - id: LR-SCHED-007
    severity: hard_zero
    title: Fabricated provenance
    description: All six selected checkpoints, traces, costs, and metrics must come from logged full runs of one identical candidate source inventory in this allocation.
  - id: LR-SCHED-008
    severity: hard_zero
    title: Tuning-only submission
    description: A submission must preregister a mechanism, exact equation, trajectory prediction, rejection criterion, and discriminating removal ablation. Parameter sweeps or selection by official score alone do not support a scientific claim.
