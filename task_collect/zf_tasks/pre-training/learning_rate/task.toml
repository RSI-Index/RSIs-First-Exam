schema_version = "1.3"
source = "NVIDIA-NeMo/Megatron-Bridge@accefd7b3a448ab45b015edc04c9d3b70f7cb3b7"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = [
    "*/cache", "*/cache/*",
    "*/tensorboard", "*/tensorboard/*",
    "*/wandb", "*/wandb/*",
    "attempts/*/checkpoints", "attempts/*/checkpoints/*",
    "source-worktrees", "source-worktrees/*",
  ] },
]

[task]
name = "more-task/learning-rate"
description = "Discover one scale-general learning-rate schedule mechanism that improves the Paloma trajectory and final quality of locked Marin AdamH/WSD training across 550M to 2.545B."
authors = [{ name = "More Task" }]
keywords = ["learning-rate", "schedule", "scaling-ladder", "paloma", "training-loss", "megatron-bridge"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "accefd7b3a448ab45b015edc04c9d3b70f7cb3b7"
mcore_commit = "58bf14e9e68915a5e0c7d70451620e6e713c07d5"
license = "Apache-2.0"

[metadata.optimization]
metric = "geometric mean of exact-final and trajectory Paloma micro-BPB gains across E0-E5"
direction = "higher"
submission_mode = "artifact"
scope = "one stateless schedule of normalized progress shared by both locked AdamH peak learning rates; model, data, optimizer, batches, horizon, topology, and evaluator are frozen"

[metadata.baseline]
method = "locked Marin AdamH recipes with Llama-3-scaled RoPE"
manifest = "/task-data/lr_schedule_baselines.json"
scale_order = ["E0", "E1", "E2", "E3", "E4", "E5"]
minimum_scale_parameters = 550337664
maximum_scale_parameters = 2544614912
training_sequence_length = 4096
seed = 0
aggregate_paloma_gain_minimum = 1.002
endpoint_micro_rule = "strictly lower at every rung"
intermediate_micro_absolute_tolerance = 0.005
macro_noninferiority = 1.005
minimum_improved_scales = 4
minimum_absolute_micro_improvement = 0.002
trajectory_area_rule = "strictly positive at every rung"

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/more_task"
base_runtime_image = "images/megatron-bridge-llama14b-accefd7b3a44-dbd0f1abbad5.sif"
paloma_data = "data/paloma-rev-65cd6fc"
outer_allocation_gpus = 256
outer_allocation_nodes = 32
gpus_per_node = 8
scale_gpus = [8, 8, 8, 32, 32, 128]
tensor_parallel = 1
pipeline_parallel = 1
training_context = 4096
evaluation_context = "Paloma at 4096 tokens plus token-normalized training-loss/cost traces"
transport = "NCCL IB/RDMA device bind enabled"
web_search = "disabled"

[agent]
network_mode = "public"
timeout_sec = 244800

[environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/more_task/images/learning-rate-environment-accefd7b3a44-r1.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 256

[environment.env]
WANDB_MODE = "offline"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
LR_SCHEDULE_ASSET_ROOT = "/proj/datasets/interns/yuetai/agent_envs/more_task"
LR_SCHEDULE_PROJECT = "/app/project"
LR_SCHEDULE_OUTPUT_ROOT = "/app/output"
LR_SCHEDULE_BASELINES = "/task-data/lr_schedule_baselines.json"

[verifier]
timeout_sec = 14400
environment_mode = "shared"
network_mode = "public"

[verifier.env]
LR_SCHEDULE_SMOKE_VERIFIER = "0"
