schema_version = "1.3"
source = "NVIDIA-NeMo/Megatron-Bridge@accefd7b3a448ab45b015edc04c9d3b70f7cb3b7"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = [
    "*/cache", "*/cache/*",
    "*/tensorboard", "*/tensorboard/*",
    "*/wandb", "*/wandb/*",
    "attempts/*/checkpoints", "attempts/*/checkpoints/*",
    "source-worktrees", "source-worktrees/*",
  ] },
]

[task]
name = "more-task/positional-encoding"
description = "Invent one positional mechanism that improves official long-context perplexity at every locked scale from 550M through 2.545B while preserving Paloma quality."
authors = [{ name = "More Task" }]
keywords = ["positional-encoding", "scaling-ladder", "length-generalization", "longppl", "paloma", "megatron-bridge"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "accefd7b3a448ab45b015edc04c9d3b70f7cb3b7"
mcore_commit = "58bf14e9e68915a5e0c7d70451620e6e713c07d5"
license = "Apache-2.0"

[metadata.optimization]
metric = "geometric-mean relative LongPPL improvement across E0-E5, hard-gated at every rung"
direction = "higher"
submission_mode = "artifact"
scope = "one scale-general positional-information or attention-scope mechanism; all six training recipes and evaluators are frozen"

[metadata.baseline]
method = "locked Marin AdamH recipes with Llama-3-scaled RoPE"
manifest = "/task-data/positional_adamh_baselines.json"
scale_order = ["E0", "E1", "E2", "E3", "E4", "E5"]
minimum_scale_parameters = 550337664
maximum_scale_parameters = 2544614912
training_sequence_length = 4096
seed = 0
paloma_tolerance = 1.01
longppl_rule = "strictly lower than the matching scale baseline"
parameter_tolerance = 1.02

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/more_task"
base_runtime_image = "images/megatron-bridge-llama14b-accefd7b3a44-dbd0f1abbad5.sif"
paloma_data = "data/paloma-rev-65cd6fc"
longppl_data = "data/longppl-govreport-b4f80af"
outer_allocation_gpus = 256
outer_allocation_nodes = 32
gpus_per_node = 8
scale_gpus = [8, 8, 8, 32, 32, 128]
tensor_parallel = 1
pipeline_parallel = 1
training_context = 4096
evaluation_context = "official GovReport documents at 16384-32768 source tokens"
transport = "NCCL IB/RDMA device bind enabled"
web_search = "disabled"

[agent]
network_mode = "public"
timeout_sec = 244800

[environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/more_task/images/positional-encoding-scaling-ladder-environment-accefd7b3a44-r3.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 256

[environment.env]
WANDB_MODE = "offline"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
POSITIONAL_ASSET_ROOT = "/proj/datasets/interns/yuetai/agent_envs/more_task"
POSITIONAL_PROJECT = "/app/project"
POSITIONAL_OUTPUT_ROOT = "/app/output"
POSITIONAL_SCALING_BASELINES = "/task-data/positional_adamh_baselines.json"

[verifier]
timeout_sec = 14400
environment_mode = "shared"
network_mode = "public"

[verifier.env]
POSITIONAL_SMOKE_VERIFIER = "0"
