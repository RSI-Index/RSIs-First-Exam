version: 1
task: positional-encoding
submission_mode: artifact
allowed_source_globs:
  - 3rdparty/Megatron-LM/megatron/core/models/**
  - 3rdparty/Megatron-LM/megatron/core/transformer/**
  - 3rdparty/Megatron-LM/megatron/core/fusions/**
  - 3rdparty/Megatron-LM/megatron/core/extensions/**
  - src/megatron/bridge/models/**
  - examples/training/positional_encoding/runtime/positional_*.py
constraints:
  scale_order: [E0, E1, E2, E3, E4, E5]
  model_parameters: [550337664, 837007744, 998036992, 1384584448, 1934716160, 2544614912]
  training_updates: [44317, 55125, 38014, 40283, 56477, 35510]
  sequence_length: 4096
  seed: 0
  tensor_parallel: 1
  pipeline_parallel: 1
  maximum_parameter_multiplier: 1.02
  training_data: locked Marin AdamH mixtures and order only
  external_network: forbidden for experiment artifacts
rules:
  - id: PE-SCALE-001
    severity: hard_zero
    title: Evaluator or orchestration tampering
    description: Do not modify or bypass Paloma, LongPPL, lm-eval adapter, scoring, tests, launchers, task tools, scale profiles, or the trusted pretraining entrypoint.
  - id: PE-SCALE-002
    severity: hard_zero
    title: Fixed-pipeline bypass
    description: Do not change data, tokenizer, model shapes, optimizer or either LR branch, schedule, objective, precision, seed, topology, training length, token budgets, batches, or cross-document masking.
  - id: PE-SCALE-003
    severity: hard_zero
    title: Scale lookup
    description: The positional mechanism must be one continuous rule. Do not branch on E0-E5, exact scale keys, exact parameter counts, or a lookup table identifying benchmark widths or depths.
  - id: PE-SCALE-004
    severity: hard_zero
    title: Evaluation leakage
    description: Do not train on Paloma or GovReport, encode evaluation samples or identifiers, or branch on evaluator inputs.
  - id: PE-SCALE-005
    severity: hard_zero
    title: External artifact
    description: Do not use an external checkpoint, pretrained model, post-training phase, undeclared data, or downloaded solution artifact.
  - id: PE-SCALE-006
    severity: hard_zero
    title: Fabricated provenance
    description: All six selected checkpoints and metrics must come from logged full runs of the same source inventory in this allocation.
