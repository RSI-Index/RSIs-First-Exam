schema_version = "1.3"
source = "mlfoundations/open_clip@db4d4911cc0fc4bc58bc98579c52875750450530 + mlfoundations/datacomp@4a8df1992566ef8334773f7152e1855b1f716162"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = [
    "*/wandb", "*/wandb/*",
    "*/hf-cache", "*/hf-cache/*",
  ] },
]

[task]
name = "scale-autoresearch/openclip-datacomp-medium-v2-hardened"
description = "Beat the hardened OpenCLIP baseline — the sealed best of an authors' sweep over all obvious in-repo switch combinations — on the frozen 38-task suite at a fixed training GPU-hour budget on 8xH100. The trivial configuration space is pre-exhausted and disclosed; every reward point requires research beyond it."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["openclip", "datacomp", "clip", "vision-encoder", "data-curation", "contrastive-pretraining", "hardened-baseline"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "db4d4911cc0fc4bc58bc98579c52875750450530"
license = "open_clip: MIT-style; datacomp: MIT; snapshot images: staged internally, not redistributed"

[metadata.optimization]
metric = "avg_38: unweighted mean of per-task main metrics over the pinned DataComp 38-dataset evaluation suite (ImageNet zero-shot reported, unscored)"
direction = "higher"
submission_mode = "artifact"
scope = "identical to v1: curation, objective, architecture (from scratch, within parameter budget), tokenizer, augmentation, optimizer, schedule, batching, precision, parallelism, harness; frozen are the snapshot, GPU-hour cap, 8xH100 topology, parameter budget, no-pretrained-weights rule, and the evaluator"

[metadata.science]
headline = "With the trivial in-repo configuration space pre-exhausted and disclosed, which curation, objective, or architectural findings still improve a from-scratch image-text encoder at a fixed GPU-hour budget?"
guiding_question = "The disclosed sweep table is a free map of what flag-flipping buys at this scale. What does it miss — and why? Interactions between curation and objective, throughput-for-samples trades, and mechanisms absent from the default space are the intended search directions."

[metadata.fidelity]
reference = "pinned mlfoundations/open_clip and mlfoundations/datacomp repositories only"
baseline = "hardened: max over the authors' sealed trivial-configuration sweep (loss family, patch dropout, tower presets, filtering thresholds, schedule presets, and their best composition) under the identical contract"
non_repository_inputs = "none for scientific design; the sealed pool snapshot, H100 SKU, container, offline eval staging, submit wrapper, verifier, and reward are task infrastructure. NOTE: budget redefined from fixed samples-seen to fixed GPU-hours; the sweep itself is task infrastructure, run once by the authors at build time."

[metadata.baseline]
method = "hardened baseline: best of the ~10-run sealed sweep on the sealed snapshot under the GPU-hour budget; full sweep disclosed in instruction.md"
score_status = "provisional_estimates_pending_author_sweep"
provisional_note = "avg_38 = 0.345 below is a literature-derived ESTIMATE of the sweep maximum (SigLIP-loss + patch-dropout composition over the paper baseline 0.328). The task authors will execute the full disclosed sweep on the sealed snapshot under the GPU-hour contract before release; the measured maximum replaces this value and CLIP_S_BASE in tests/score.py, and the measured per-row scores replace the instruction.md table."
reference_run = "pending"
sweep_manifest = "pending: sweep grid S-00..S-09 + per-run scores, sealed at build time"
parameters = 151277313          # winning sweep config parameters; re-measured at sweep
parameter_budget = 189000000    # 1.25x ViT-B/32 default; author-review knob
training_gpu_hours_cap = 20.0   # provisional; same cap as v1
avg_38 = 0.345                  # provisional ESTIMATE of sweep max
imagenet_zeroshot = 0.31        # provisional ESTIMATE
throughput_samples_per_s = 0.0  # sealed at author run; published as allocation anchor
screening_anchors = "pending: IN zero-shot + fast-subset at 10/25/50/100% budget, sealed at author run"
reward = 0.0                    # baseline sits at the gate by construction

[metadata.reward]
formula = "reward = clip((avg_38 - S_base) / (S_ref - S_base), 0, 1); 0 unless avg_38 > S_base"
S_base = 0.345  # provisional estimate; sealed at author sweep (env CLIP_S_BASE)
S_ref = 0.390   # same frontier anchor as v1; because S_base is higher, the same absolute score maps to a smaller reward than in v1 (env CLIP_S_REF)

[metadata.run_contract]
full_run_gpus = 8
agent_trajectories = 1
web_search = "disabled"
hard_network_isolation = true
scientific_budget = "at most 20.0 (provisional) H100-hours of GPU compute per candidate attempt; all GPU work of an attempt charged; CPU-only curation free; frozen final eval uncharged; nominal samples-seen ceiling 2x baseline"
topology_mapping = "single node x 8 H100, exactly; /task-tools/clip_async_run.py enforces the GPU-hour cap with a watchdog hard kill"
measured_single_run = "pending author sweep (paper-derived estimate: ~2.5 h wall on 8xH100 per run)"
default_agent_session = "async submit wrapper; 30-minute status.json polling with the agent offline; interrupted runs resume in place from open_clip checkpointing"

[agent]
network_mode = "none"

[environment]
network_mode = "none"
docker_image = "scale-autoresearch/openclip-datacomp-environment:v1"  # shared image with v1; tasks differ only in anchors/policy
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 8388608
gpus = 8
gpu_types = ["H100"]

[environment.env]
WANDB_MODE = "offline"
CLIP_GPU_HOURS_CAP = "20.0"
CLIP_TOPOLOGY_GPUS = "8"
CLIP_SNAPSHOT_DIR = "/datasets/datacomp-medium-snapshot/current"
DATACOMP_EVAL_DIR = "/datasets/datacomp-eval"

[verifier]
timeout_sec = 14400
environment_mode = "separate"
network_mode = "none"

[verifier.environment]
network_mode = "none"
docker_image = "scale-autoresearch/openclip-datacomp-tests:v2"
build_timeout_sec = 10800
cpus = 32
memory_mb = 131072
storage_mb = 1048576
gpus = 1  # datacomp evaluation is single-process
gpu_types = ["H100"]

[verifier.environment.env]
WANDB_MODE = "offline"
DATACOMP_EVAL_DIR = "/datasets/datacomp-eval"
CLIP_PARAM_BUDGET = "189000000"
CLIP_S_BASE = "0.345"
CLIP_S_REF = "0.390"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
