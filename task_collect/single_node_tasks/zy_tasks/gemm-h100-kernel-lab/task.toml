schema_version = "1.3"
artifacts = [
  "/logs/verifier/reward.json",
  "/logs/verifier/gemm_results.json",
  { source = "/logs/agent/continuation_rounds", destination = "continuation_rounds" },
  { source = "/logs/agent/gemm_h100_kernel_lab_training", destination = "gemm_h100_kernel_lab_training" }
]

[task]
name = "ai-infra/gemm-h100-kernel-lab"
description = "Clean-room CUDA fp16 GEMM optimization task for NVIDIA H100 GPUs."
authors = []
keywords = ["cuda", "gemm", "fp16", "tensor-core", "h100", "hopper", "gpu", "performance"]

[metadata]
difficulty = "hard"
category = "gpu"
tags = ["cuda-kernel", "gemm", "fp16", "tensor-core", "h100", "hopper", "local-gpu", "optimization", "clean-room"]

[verifier]
timeout_sec = 3600.0
reward_json = "/logs/verifier/reward.json"

[verifier.env]
GEMM_VERIFY_SHAPES = "4096x4096x4096"
GEMM_VERIFY_WARMUP = "20"
GEMM_VERIFY_ITERS = "200"
GEMM_VERIFY_REPEATS = "5"
GEMM_VERIFY_SAMPLES = "2048"
GEMM_VERIFY_BUILD_TIMEOUT = "900"

[agent]
timeout_sec = 17200.0

[environment]
build_timeout_sec = 3600.0
os = "linux"
cpus = 8
memory_mb = 32768
storage_mb = 60000
gpus = 1
gpu_types = ["H100"]
allow_internet = true
mcp_servers = []

[environment.env]
CUDA_HOME = "/usr/local/cuda"
CUDA_VISIBLE_DEVICES = "0"
GEMM_CUDA_ARCH = "90a"

[solution.env]
