schema_version = "1.1"
source = "THUDM/slime@06ffdbe22be068b52f9ed0fc318c473f7030197e"

[task]
name = "autolab/slime-search-r1-algorithm"
description = "Improve the RL algorithm for Slime Search-R1 while Qwen2.5-3B base, search data, BM25, rollouts, rewards, and compute stay frozen."
authors = [{ name = "AutoLab" }]
keywords = ["slime", "search-r1", "reinforcement-learning", "algorithm-research", "qwen2.5"]

[metadata]
difficulty = "expert"
category = "model_development"
upstream_commit = "06ffdbe22be068b52f9ed0fc318c473f7030197e"
license = "Apache-2.0"

[metadata.optimization]
metric = "hidden pinned Search-R1 reward (effective exact match at this revision), dynamically anchored from base to released GRPO"
direction = "higher"
submission_mode = "artifact"
scope = "pinned Slime built-in advantage estimator, policy clipping/normalization, KL/entropy, TIS, and optimizer dynamics; frozen are model, data/order, BM25, rollout/reward, sampling, topology, batch, seed, and 1000 rounds"

[metadata.science]
headline = "Find a better search-agent RL algorithm at exactly matched data, environment, and compute."
guiding_question = "Which online RL objective improves search-grounded answer reward when the full Search-R1 interaction pipeline is held fixed?"
paper = "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning (Jin et al., arXiv:2503.09516)"

[metadata.fidelity]
training_code = "THUDM/slime@06ffdbe22be068b52f9ed0fc318c473f7030197e"
starting_checkpoint = "Qwen/Qwen2.5-3B@3aab1f1954e9cc14eb9509a215f9e5ca08227a9b (base)"
training_data = "PeterJinGo/nq_hotpotqa_train@b7d80abfee334a7a91cb377544f09180d58b34f6"
retriever = "CPU BM25 over wiki-18, top-k 3"

[metadata.baseline]
method = "Slime Search-R1 GRPO, KL=0.001 low_var_kl, clip=0.2/0.28, Adam 1e-6"
score_status = "requires first 8xH100 reproduction"
reference_anchor = "PeterJinGo/SearchR1-nq_hotpotqa_train-qwen2.5-3b-em-grpo@d4d2f71e39ff3e0ed4def1e8f860b87d9f6bfac7 evaluated dynamically"

[metadata.run_contract]
gpu_type = "H100"
actor_gpus = 4
rollout_gpus = 4
global_batch_size = 256
rollout_batch_size = 32
samples_per_prompt = 8
rollout_rounds = 1000
max_response_length = 512
max_search_turns = 2
search_top_k = 3
seed = 123
agent_trajectories = 1
web_search = "disabled"

[agent]
timeout_sec = 172800

[environment]
build_timeout_sec = 43200
allow_internet = false
cpus = 64
memory_mb = 524288
storage_mb = 409600
gpus = 8
gpu_types = ["H100"]

[environment.env]
WANDB_MODE = "offline"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"

[verifier]
timeout_sec = 28800
user = "root"
