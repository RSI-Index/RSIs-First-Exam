# ASSET MANIFEST -- nanovlm-finevision-self-selection
#
# NOTHING HERE IS DOWNLOADED. This package is configuration only: no weights, no images, no
# vendored source. Every row below is a URL plus where it must be mounted once someone with
# disk and bandwidth decides to stage it. environment/fetch_assets.sh is that fetcher, and it
# ships unexecuted.
#
# PROVENANCE. Every id, path and task string below is a literal from the pinned nanoVLM
# commit. Nothing was recalled or inferred:
#   models/config.py:15   vit_model_type   = 'google/siglip2-base-patch16-512'
#   models/config.py:33   lm_model_type    = 'HuggingFaceTB/SmolLM2-360M-Instruct'
#   models/config.py:34   lm_tokenizer     = 'HuggingFaceTB/SmolLM2-360M-Instruct'
#   models/config.py:75   train_dataset_path = 'HuggingFaceM4/FineVision_concat_shuffled_2'
#   models/config.py:76   train_dataset_name = ("default", )
#   models/config.py:84   use_lmms_eval    = True
#   models/config.py:85   lmms_eval_tasks  = 'mmstar,mmmu_val,ocrbench,...'
#   README.md (Evaluation with lmms-eval)  install source = git+https://github.com/EvolvingLMMs-Lab/lmms-eval.git
# The ten alternative FineVision config names commented out at models/config.py:76 are NOT used
# here. They are commented out upstream, this package holds no clone to check them against, and
# a config name that does not exist on the hub fails at staging time with a hub error that reads
# like a network fault. The one path that is live in the file is the one declared below.
#
# BYTE SIZES ARE GUESSES and labelled as such. Nothing in the nanoVLM repository states the size
# of FineVision or of a staged prefix of it. fetch_assets.sh records realized bytes and row
# counts into environment/staged.lock.yaml; the gates read the lockfile, never these guesses.
#
# MUTABLE-REF HAZARD (spec AS-4). Every URL here resolves through a moving ref: a HF `main`
# branch, and for lmms-eval a git branch with no tag. A revision pin therefore fixes WHICH FILES
# you get, not WHICH BYTES, until fetch_assets.sh has written the lockfile. Until then the only
# honest statement about reproducibility is the one in the lockfile's absence.
#
# The next line is read by three programs with a plain text scan rather than a YAML parse
# (task-tools/asset_check.py, which must run with no pyyaml; tests/evaluate.py; and tests/test.sh
# via grep, before python starts). NO INLINE COMMENT ON IT, EVER -- in the sibling VLM-R1 package
# a comment on this line made all three staging gates unable to fire.
state: NOT_STAGED

schema: rsi-assets/1
package: nanovlm-finevision-self-selection

model:
  - id: vision_backbone
    url: https://huggingface.co/google/siglip2-base-patch16-512
    kind: hf_model
    revision: PENDING_DOWNLOAD
    mount: /models/siglip2-base-patch16-512
    consumed_by: [agent, verifier]
    why: >
      models/config.py:15 vit_model_type. Loaded by models/vision_transformer.py at
      from_pretrained time; the run cannot start without it.
    size_guess: "UNKNOWN (GUESS: ~1 GB)"

  - id: language_backbone
    url: https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct
    kind: hf_model
    revision: PENDING_DOWNLOAD
    mount: /models/SmolLM2-360M-Instruct
    consumed_by: [agent, verifier]
    why: >
      models/config.py:33-34, both lm_model_type and lm_tokenizer. Supplies the tokenizer the
      chat template and the 66 extra VLM tokens are added to, so it is also an evaluator input.
    size_guess: "UNKNOWN (GUESS: ~1.5 GB)"

train:
  - id: finevision_pool
    url: https://huggingface.co/datasets/HuggingFaceM4/FineVision_concat_shuffled_2
    kind: hf_dataset
    config: default
    revision: PENDING_DOWNLOAD
    mount: /datasets/finevision_pool
    consumed_by: [agent]
    stage_as: load_from_disk
    stage_prefix_rows: 1500000
    why: >
      models/config.py:75-76. THE SELECTION POOL. Staged as a fixed PREFIX of the stream rather
      than the whole dataset, and materialised to disk rather than streamed, for two reasons that
      are both contract terms:
        (1) streaming needs network egress inside the training container, and a container with
            egress can fetch the evaluation sets -- the eval-containment boundary would be a
            promise instead of a mount boundary;
        (2) train.py:160 applies shuffle(seed=0) ONLY when stream_dataset is False, so a streamed
            pool has a hub-file-order-dependent identity and a take/skip val split that moves
            with it. A materialised prefix has one identity, and dir_hash.py can state it.
      A prefix is well defined because streaming does not shuffle: rows arrive in hub file order.
    size_guess: "UNKNOWN (GUESS: 75-250 GB for 1.5M rows); MEASURE at staging"

eval:
  # There are no dataset URLs in this section on purpose. The evaluation sets are owned by
  # lmms-eval's task configs, and hardcoding ids for them here would be this package asserting
  # facts about a repository it does not pin the contents of. The fetcher pre-downloads them by
  # invoking the pinned lmms-eval and records the ids and revisions it actually resolved into
  # staged.lock.yaml, which is what the gates read.
  - id: lmms_eval
    url: git+https://github.com/EvolvingLMMs-Lab/lmms-eval.git
    kind: git
    revision: PIN_REQUIRED
    mount: /opt/lmms-eval
    consumed_by: [verifier]
    why: >
      README.md's Evaluation section installs this from an UNPINNED branch, and evaluation.py is
      a copy of that project's __main__.py importing its internals (lmms_eval.evaluator
      .request_caching_arg_to_dict, lmms_eval.api.registry.ALL_TASKS). An unpinned evaluator is a
      moving metric: the same checkpoint scores differently across rounds of the same chain, and
      the drift is attributed to the improver.
    pin_note: >
      PIN_REQUIRED is not a placeholder that can be ignored. We do not know a good commit and
      will not invent one. tests/contract_check.py reports EVALUATOR NOT PINNED, the verifier
      Dockerfile has no default for the ARG so the build fails, and tests/test.sh gate 0
      infra_fails on it -- so an unpinned evaluator cannot reach a score by any path.
    size_guess: "UNKNOWN (GUESS: eval sets 30-80 GB); MEASURE at staging"

  - id: eval_sets
    url: RESOLVED_BY_LMMS_EVAL
    kind: resolved
    mount: /eval-data/lmms_eval_home
    consumed_by: [verifier]
    why: >
      HF_HOME for the verifier image. The pinned lmms-eval downloads the nine task datasets
      named at models/config.py:85 into it. VERIFIER ONLY: this path does not exist in the agent
      image, which is the same containment boundary the sibling package enforces for /eval-data.
    size_guess: "UNKNOWN; MEASURE at staging"

code:
  - id: nanovlm_source
    url: https://github.com/huggingface/nanoVLM
    kind: git
    revision: 4e0c0961846135c2217f95e54cb4c2d66eb55e42
    mount: /opt/project
    consumed_by: [agent, verifier]
    why: >
      Cloned at BUILD time in both Dockerfiles, then patched with environment/rsi_adapter.patch.
      /opt/project is therefore the pristine base and NOT bare upstream -- see contract.yaml
      pristine_base.patch, which names both touched files and their hunk counts, and
      tests/upstream_check.py, which verifies the commit before patching and the patch after.
    size_guess: "~27 MB"

must_not_stage:
  # Blocklist, enforced by task-tools/asset_check.py sweeping the agent's mounts. Each entry is
  # something a plausible convenience step would pull in and that would silently invalidate the
  # benchmark.
  - url: https://huggingface.co/lusxvr/nanoVLM-450M
    why: >
      eval/lmms_eval_wrapper.py:28 default model=, and README.md:126/133/152. A fully trained
      nanoVLM. Staged into the agent's mounts, round 1 becomes a download.
  - url: https://huggingface.co/lusxvr/nanoVLM-230M-8k
    why: >
      generate.py:21 --hf_model default -- a DIFFERENT trained checkpoint from the one the eval
      wrapper defaults to. The first draft of this blocklist named only the 450M and asserted
      generate.py defaulted to it too; generate.py does not. Two entry points, two defaults, and
      a blocklist that covers one of them is a blocklist with a hole. asset_check.py matches on
      the repo-name substrings `nanoVLM-450M` and `nanoVLM-230M`, not on the full URLs, because
      the failure mode is a local directory named after the repo.
  - url: RESOLVED_BY_LMMS_EVAL
    why: >
      The evaluation sets must never be mounted in the agent container. They are the metric.
  - path_pattern: "/datasets/**/mmstar*"
    why: >
      MMStar is the headline. FineVision is an instruction-tuning corpus and a staged prefix of
      it should contain no MMStar rows, but "should" is not a check -- asset_check.py greps the
      staged pool's config names and file paths for the nine evaluation task names.

on_stage_write:
  # What fetch_assets.sh must record before anything may be scored. A flag flipped without these
  # is a gate that cannot fail.
  - environment/staged.lock.yaml       # per-asset revision, sha256 or dir digest, realized bytes
  - "assets.yaml state: NOT_STAGED -> STAGED"
  - "lockfile pool_rows: realized row count of the staged prefix"
  - "lockfile lmms_eval_commit: the resolved commit, replacing PIN_REQUIRED"
  - "lockfile eval_sets: the dataset ids and revisions lmms-eval actually resolved"
