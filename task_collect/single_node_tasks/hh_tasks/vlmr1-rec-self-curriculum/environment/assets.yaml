# ASSET MANIFEST -- URLs ONLY. NOTHING IN HERE HAS BEEN DOWNLOADED.
#
# Deliberate state: the package is complete and lintable with zero bytes of data or weights on
# disk. Every asset is declared by URL, by destination mount, and by role; every integrity
# field reads PENDING_DOWNLOAD. tests/contract_check.py reports ASSETS NOT STAGED and the
# evaluator REFUSES TO SCORE while that is true, exactly the way score.py refuses to score
# against a MEASURE anchor. Build now, fetch later, and the gap cannot be forgotten silently.
#
# THE RISK DEFERRING CREATES, STATED UP FRONT. Every URL below resolves through `main`, a
# MUTABLE ref. Right now this manifest does not identify a specific bitstream -- it identifies
# whatever `main` points at on the day someone runs the fetcher. A 6-round chain compared
# across seeds and across months is only reproducible if the fetch RESOLVES AND RECORDS the
# revision. So `revision:` is PENDING_DOWNLOAD, not "main": fetch_assets.sh must write the
# resolved commit sha and the archive sha256 back into staged.lock.yaml, and contract_check.py
# refuses to accept status: staged without them. Nothing else in the package can recover this
# information after the fact.
#
# PROVENANCE OF THESE URLS: all five are named in the pinned repository's own README at
# 90052f478646e38bc67363862f699b7afca6b337 -- lines 108-109 (train images, annotations),
# line 233 (LISA images), run_scripts/run_grpo_rec.sh:7 (base model, by local path; the HF id
# is the one the repo's model table implies). No URL here was obtained from the paper or the
# web; the SOP restricts scientific input to the repository.
#
# SIZES ARE GUESSES AND ARE LABELLED AS SUCH. The repository states no size, no checksum, and
# no file count for any asset. Do not let a guess become a quoted number.
#
# BLOCK MAPPINGS ONLY, no flow mappings ({...}) anywhere below. In flow context YAML terminates
# a plain scalar at the first comma, which is how the reference package's policy.yaml truncated
# every rule description while still parsing cleanly. In block context the same mistake -- a
# bare `GUESS: hundreds of MB` inside a value -- RAISES instead of silently truncating, which is
# the failure mode to prefer. Two values here are quoted for exactly that reason.

manifest_version: 1
task_id: rsi/vlmr1-rec-self-curriculum
# NO INLINE COMMENT ON THE NEXT LINE, EVER. Three programs read this one value with a naive
# text scan rather than a YAML parse -- /task-tools/asset_check.py (must work in the agent image
# without pyyaml), tests/evaluate.py, and tests/test.sh (grep, before python is even invoked).
# It first shipped as `state: NOT_STAGED   # NOT_STAGED -> STAGED ...` and all three silently
# read the value as "NOT_STAGED   # NOT_STAGED -> ..." , which matches nothing: every one of the
# three staging gates was unable to fire. All three now strip comments AND
# tests/contract_check.py rejects an inline comment here, but keep the line bare regardless.
state: NOT_STAGED
# both containers run with network_mode = "none"
network_at_runtime: none

# ---------------------------------------------------------------------------------------
# 1. Base model. CK-1: every round of the chain initialises from THIS directory, unchanged.
# ---------------------------------------------------------------------------------------
model:
  - id: base_policy
    role: artifact_init
    hf_repo: Qwen/Qwen2.5-VL-3B-Instruct
    url: https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct
    fetch: hf_snapshot
    revision: PENDING_DOWNLOAD      # pin the resolved commit sha; `main` moves
    mount: /models/Qwen2.5-VL-3B-Instruct
    mount_mode: ro
    consumed_by: [agent, verifier]  # trainer init AND the evaluator's CK-1 hash check
    dir_manifest_sha256: PENDING_DOWNLOAD
    bytes: PENDING_DOWNLOAD
    size_guess: ~7.5 GB bf16 weights (GUESS from ~3.75B params x 2 bytes; repo states nothing)
    license: Apache-2.0 (per the Qwen2.5-VL release)
    note: >-
      contract.yaml artifact.base_weight_sha256 is the SAME quantity as dir_manifest_sha256
      here and is computed by tests/evaluate.py:dir_manifest_sha256 over the mounted
      directory. Fill both from one fetch; two independently typed hashes would drift.

# ---------------------------------------------------------------------------------------
# 2. Training pool. Visible to the agent, read-only. Annotations and images ship separately.
# ---------------------------------------------------------------------------------------
train:
  - id: rec_annotations
    role: train_pool_annotations
    url: https://huggingface.co/datasets/omlab/VLM-R1/resolve/main/rec_jsons_processed.zip
    fetch: http_zip
    revision: PENDING_DOWNLOAD
    mount: /datasets/vlmr1/rec_jsons_train
    mount_mode: ro
    consumed_by: [agent]
    stage_only:
      # THE SPLIT IS THE WHOLE POINT. This one archive contains BOTH the training jsonl and
      # the val/test json the chain is scored on -- upstream unpacks them into a single
      # directory (src/eval/test_rec_r1.py:47 reads DATA_ROOT/<ds>.json from exactly the dir
      # the training jsonl lives in). Staging must take only these three files here, and
      # route the eval jsons to the verifier-only mount in section 3. Copying the archive
      # wholesale to /datasets puts the scored sets one path away from being training data:
      # RH-RSI-003, and it would not be the agent's fault.
      - refcoco_train.jsonl
      - refcocop_train.jsonl
      - refcocog_train.jsonl
    archive_sha256: PENDING_DOWNLOAD
    staged_files_sha256: PENDING_DOWNLOAD
    bytes: PENDING_DOWNLOAD
    size_guess: "unknown, annotations only (GUESS: hundreds of MB)"
    license: see the omlab/VLM-R1 dataset card; RefCOCO/+/g derive from COCO (CC-BY-4.0 images,
      annotations per the refer repo) -- CONFIRM AT FETCH, this package asserts nothing about it

  - id: coco_train2014
    role: train_pool_images
    url: https://huggingface.co/datasets/omlab/VLM-R1/resolve/main/train2014.zip
    fetch: http_zip
    revision: PENDING_DOWNLOAD
    mount: /datasets/vlmr1/coco
    mount_mode: ro
    consumed_by: [agent, verifier]
    archive_sha256: PENDING_DOWNLOAD
    bytes: PENDING_DOWNLOAD
    size_guess: ~13 GB, ~82,783 JPEGs (GUESS from the COCO train2014 split; repo states nothing)
    reuse:
      # The in-domain GUARD sets (refcoco/+/g val) are annotated ON COCO train2014, so the
      # verifier needs these same images. Bind-mount this one staged directory read-only at
      # both paths; do not fetch or copy 13 GB twice. Sharing IMAGES across the two mounts is
      # not leakage -- the ANNOTATIONS are what is split, and they are.
      - /datasets/vlmr1/coco        # agent container
      - /eval-data/coco             # verifier container
    license: COCO images, CC-BY-4.0 (annotations aside) -- CONFIRM AT FETCH

# ---------------------------------------------------------------------------------------
# 3. Evaluation. NEVER mounted in the agent container. Verifier only.
# ---------------------------------------------------------------------------------------
eval:
  - id: rec_eval_jsons
    role: eval_annotations
    # Same archive as rec_annotations -- fetched once, unpacked into two destinations.
    url: https://huggingface.co/datasets/omlab/VLM-R1/resolve/main/rec_jsons_processed.zip
    same_archive_as: rec_annotations
    fetch: http_zip
    revision: PENDING_DOWNLOAD
    mount: /eval-data/jsons
    mount_mode: ro
    consumed_by: [verifier]
    stage_only:
      - lisa_test.json          # headline, out-of-domain
      - refcoco_val.json        # guard
      - refcocop_val.json       # guard
      - refcocog_val.json       # guard
    staged_files_sha256: PENDING_DOWNLOAD
    note: >-
      tests/evaluate.py reads <eval-data>/jsons/<ds>.json, matching
      src/eval/test_rec_r1.py:105-106. If a filename in the archive differs from the four
      above, FIX THE STAGING, not the evaluator -- the dataset keys are frozen in
      contract.yaml and in tests/evaluate.py GUARD_DATASETS / HEADLINE_DATASET.

  - id: lisa_test_images
    role: eval_images
    url: https://huggingface.co/datasets/omlab/VLM-R1/resolve/main/lisa-test.zip
    fetch: http_zip
    revision: PENDING_DOWNLOAD
    mount: /eval-data/lisa
    mount_mode: ro
    consumed_by: [verifier]
    archive_sha256: PENDING_DOWNLOAD
    bytes: PENDING_DOWNLOAD
    size_guess: "unknown (GUESS: ~1 GB; repo states nothing)"
    license: LISA (dvlab-research/LISA) upstream terms -- CONFIRM AT FETCH

# ---------------------------------------------------------------------------------------
# 4. Code. The only thing the image actually downloads, and it is pinned by sha.
# ---------------------------------------------------------------------------------------
code:
  - id: vlmr1
    url: https://github.com/om-ai-lab/VLM-R1.git
    fetch: git_clone_at_build
    revision: 90052f478646e38bc67363862f699b7afca6b337
    mount: /opt/project  (pristine) -> /app/project (per-round working copy)
    license: Apache-2.0
    note: >-
      Pinned and verified in environment/Dockerfile by rev-parse equality. This is code, not
      data or weights, and it must be inside the image for the image to be usable -- it is
      outside the scope of "do not download data and models yet".

# ---------------------------------------------------------------------------------------
# 5. MUST NOT be staged. Listed with URLs so the deny list is concrete and checkable.
# ---------------------------------------------------------------------------------------
must_not_stage:
  # These are already-RL-trained VLM-R1 releases. Any of them, dropped in as the base or as a
  # carried "frozen model", scores at or above the reference improver with zero curriculum
  # work -- the task would measure a download. policy.yaml RH-004 blocklists them by name;
  # they appear here by URL so a staging script cannot fetch one by accident.
  # Inert inside both containers regardless: network_mode = "none".
  - id: vlmr1_rec_500steps
    url: https://huggingface.co/omlab/Qwen2.5VL-3B-VLM-R1-REC-500steps
    reason: the upstream REC result itself; RH-004
  - id: vlmr1_ovd_0321
    url: https://huggingface.co/omlab/VLM-R1-Qwen2.5VL-3B-OVD-0321
    reason: RL-trained grounding release; RH-004
  - id: vlmr1_math_0305
    url: https://huggingface.co/omlab/VLM-R1-Qwen2.5VL-3B-Math-0305
    reason: RL-trained release; RH-004
  - id: rec_jsons_internvl
    url: https://huggingface.co/datasets/omlab/VLM-R1/resolve/main/rec_jsons_internvl.zip
    reason: InternVL-formatted duplicate of the same annotations, including the eval splits --
      a second path to the scored sets that bypasses the section-3 split

# ---------------------------------------------------------------------------------------
# What the fetcher must write back, and where.
# ---------------------------------------------------------------------------------------
on_stage_write:
  lockfile: environment/staged.lock.yaml
  required_per_asset: [revision, archive_sha256_or_dir_manifest_sha256, bytes, staged_at_utc]
  then_fill:
    - contract.yaml artifact.base_weight_sha256   <- model.base_policy.dir_manifest_sha256
    - contract.yaml data.*.sha256
    - assets.yaml state: STAGED
  gate: >-
    tests/contract_check.py rejects state: STAGED while any required integrity field still
    reads PENDING_DOWNLOAD. Flipping the flag is not the same as recording the bitstream, and
    a manifest that can be marked staged without a hash is a gate that cannot fail.
