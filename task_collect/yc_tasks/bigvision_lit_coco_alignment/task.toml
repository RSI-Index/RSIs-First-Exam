schema_version = "1.3"
source = "google-research/big_vision@8921d5141504390a8a4f7b2dacb3b3c042237290"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = ["logs/*", "scratch/*", "training/checkpoint.npz"] },
]

[task]
name = "scale-autoresearch/bigvision-lit-coco-alignment"
description = "Improve COCO bidirectional retrieval by redesigning the trainable text tower and alignment loss while the official LiT ViT-B/16 image tower, data, exposure, optimizer, and evaluation remain locked."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["clip", "lit", "big-vision", "coco", "text-encoder", "contrastive-learning", "retrieval"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "8921d5141504390a8a4f7b2dacb3b3c042237290"
license = "Apache-2.0 for code; staged COCO/ImageNet and initializer assets retain their own terms"

[metadata.optimization]
metric = "coco_bidirectional_r1_geometric_mean"
direction = "higher"
submission_mode = "artifact"
scope = "candidate text tower, alignment loss, and closed-schema candidate config only; ViT-B/16 image bytes, COCO data, preprocessing, optimizer, schedule, exposure, capacity ceilings, and evaluator remain frozen"

[metadata.science]
headline = "Understand which language representations and alignment objectives best organize captions around a fixed visual geometry."
guiding_question = "Can a different text architecture, pooling/projection mechanism, token interaction, loss formulation, or negative treatment improve both COCO retrieval directions without degrading frozen-image ImageNet retention?"

[metadata.fidelity]
reference = "pinned historical Big Vision public repository only"
baseline = "unchanged lit_coco.py BERT-base text tower with frozen ViT-B/16, COCO captions, 4,096 global batch, and 5,000 steps"
non_repository_inputs = "Harbor isolation, H100/JAX compatibility image, staged asset manifests, capacity instrumentation, policy gate, verifier, and scalar reward"

[metadata.baseline]
method = "repository-anchored demo calibration using the official coco_B16B result table and explicit engineering budgets"
score_status = "complete"
reference_run = "bigvision-readme-coco_B16B"
repository_i2t_r1 = 47.2
repository_t2i_r1 = 32.1
repository_geometric_mean = 38.9245
repository_imagenet_zero_shot = 20.7
repository_anchor_role = "operational values for the repository_anchored_demo_v1 profile"

[metadata.run_contract]
single_task = true
global_batch_size = 4096
optimizer_steps = 5000
pair_exposures = 20480000
world_size = 8
image_model = "ViT-B/16"
image_parameters = "byte-identical to frozen initializer"
candidate_network = "disabled"
trainer_network = "disabled"
verifier_network = "disabled"
current_scientific_status = "complete repository-anchored demo calibration with task-owned official asset bootstrap and offline Harbor runtime"
measured_single_run = "repository-documented retrieval and ImageNet anchors plus explicitly typed engineering budgets; no local-training claim"
default_agent_session = "candidate screening may run locally; each full 5,000-step submission exits and is monitored by the external asynchronous Harbor harness"

[agent]
timeout_sec = 28800
network_mode = "none"

[environment]
network_mode = "none"
docker_image = "clip-bigvision-lit-harbor:8921d514"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 8
gpu_types = ["H100"]

[environment.env]
TFDS_DATA_DIR = "/datasets/tfds"
BIGVISION_IMAGE_INIT = "/datasets/initializers/vit_b16_augreg.npz"
BIGVISION_TEXT_INIT = "/datasets/initializers/bert_base"
BIGVISION_BASELINE_CONTRACT = "/opt/contracts/baseline_contract.json"
JAX_PLATFORMS = "cuda,cpu"
TF_CPP_MIN_LOG_LEVEL = "1"

[verifier]
timeout_sec = 14400
environment_mode = "separate"
network_mode = "none"

[verifier.environment]
network_mode = "none"
docker_image = "clip-bigvision-lit-harbor-tests:8921d514"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 8
gpu_types = ["H100"]

[verifier.environment.env]
TFDS_DATA_DIR = "/datasets/tfds"
BIGVISION_IMAGE_INIT = "/datasets/initializers/vit_b16_augreg.npz"
BIGVISION_TEXT_INIT = "/datasets/initializers/bert_base"
JAX_PLATFORMS = "cuda,cpu"
