services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: none
    read_only: true
    shm_size: 64gb
    tmpfs:
      - /tmp:size=32g,exec
    volumes:
      - ./project:/app/project
      - ${DATACOMP_COMMONPOOL_ROOT:-../.assets/commonpool_s}:/datasets/commonpool_s:ro
      - ${DATACOMP_BASELINE_CONTRACT_HOST:-../.assets/contracts/baseline_contract.json}:/opt/contracts/baseline_contract.json:ro
      - ${DATACOMP_OUTPUT_ROOT:-../.runs/output}:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
