schema_version = "1.3"
source = "mlfoundations/datacomp@4a8df1992566ef8334773f7152e1855b1f716162 + mlfoundations/open_clip@395851ee9c55fdddb63f5579955cdd6d754d261c"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = ["logs/*", "scratch/*", "selected_shards/*"] },
]

[task]
name = "scale-autoresearch/datacomp-s-filter-discovery"
description = "Improve a fixed DataComp-S ViT-B/32 learner by designing a scientifically motivated CommonPool-S UID-selection algorithm under identical data, model, exposure, and compute contracts."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["clip", "datacomp", "data-selection", "dataset-curation", "vision-language", "representation-learning"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "4a8df1992566ef8334773f7152e1855b1f716162"
dependency_commit = "395851ee9c55fdddb63f5579955cdd6d754d261c"
license = "MIT for code; staged CommonPool assets retain source terms"

[metadata.optimization]
metric = "datacomp_38_task_unweighted_mean"
direction = "higher"
submission_mode = "artifact"
scope = "candidate/selector.py only; output one sorted unique CommonPool-S UID array while the learner, model, exposure, optimizer, preprocessing, evaluator, and aggregation remain frozen"

[metadata.science]
headline = "Discover which properties of web-scale image-text data improve a fixed contrastive learner."
guiding_question = "Can semantic balance, diversity, deduplication, cluster coverage, caption quality, or a principled combination outperform the official L/14 score filter without changing the learner or compute?"

[metadata.fidelity]
reference = "pinned DataComp and OpenCLIP public repositories only"
baseline = "official CommonPool-S L/14 top-30-percent selector followed by a fresh fixed ViT-B/32 run"
non_repository_inputs = "Harbor isolation, immutable asset manifests, H100 execution adapters, policy gate, verifier, and scalar reward"

[metadata.baseline]
method = "repository-anchored demo calibration using the official L/14 selector and the locally recomputed released-checkpoint control"
score_status = "complete"
reference_run = "task6-parallel-ulimit-20260803T162507Z"
repository_anchor = 0.1731
repository_anchor_role = "official documentation anchor; the demo profile uses the locally recomputed released-control value in baseline_contract.json"

[metadata.run_contract]
single_task = true
configured_training_pairs = 12800000
realized_training_pairs = 12861440
optimizer_updates = 3140
global_batch_size = 4096
world_size = 4
candidate_network = "disabled"
trainer_network = "disabled"
verifier_network = "disabled"
current_scientific_status = "complete repository-anchored demo calibration with task-owned official asset bootstrap and offline Harbor runtime"
measured_single_run = "released-checkpoint control recomputed locally at 0.1731364262164997; this profile makes no fresh-training baseline claim"
default_agent_session = "candidate selection may be developed locally; full training submission must exit and be monitored by the external asynchronous Harbor harness"

[agent]
timeout_sec = 21600
network_mode = "none"

[environment]
network_mode = "none"
docker_image = "clip-datacomp-harbor:4a8df199"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 614400
gpus = 4
gpu_types = ["H100"]

[environment.env]
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "disabled"
DATACOMP_METADATA_DIR = "/datasets/commonpool_s/metadata"
DATACOMP_FEATURES_DIR = "/datasets/commonpool_s/features"
DATACOMP_UID_UNIVERSE = "/datasets/commonpool_s/manifests/available_uids.npy"
DATACOMP_SOURCE_SHARDS = "/datasets/commonpool_s/full_shards"
DATACOMP_BASELINE_CONTRACT = "/opt/contracts/baseline_contract.json"

[verifier]
timeout_sec = 14400
environment_mode = "separate"
network_mode = "none"

[verifier.environment]
network_mode = "none"
docker_image = "clip-datacomp-harbor-tests:4a8df199"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 4
gpu_types = ["H100"]

[verifier.environment.env]
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "disabled"
DATACOMP_EVAL_ROOT = "/datasets/evaluation"
