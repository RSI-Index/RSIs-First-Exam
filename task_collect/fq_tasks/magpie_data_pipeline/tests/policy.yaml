version: 1
task: magpie-data-pipeline
submission_mode: artifact
scope:
  writable_prefix: /app/project/data_research
  protected_paths:
    - /models
    - /task-assets
    - /task-tools
    - /opt/project
    - /tests
constraints:
  internet: disabled
  source_file_max_bytes: 10485760
  candidate_records: 1..300000
  canonical_token_budget: at_most_baseline_budget
  allowed_sources:
    - Magpie-Align/Magpie-Pro-MT-300K-v0.1@3c3045600d578b8f37413924b1b3bf117929755e
    - meta-llama/Meta-Llama-3-70B-Instruct@50fd307e57011801c7833c87efa1984ddf2db42f
  pinned_assets:
    magpie_source: magpie-align/magpie@b734a36818e4ba7ef7f0f582fc55f7e860407d26
    student: meta-llama/Meta-Llama-3-8B@8cde5ca8380496c9a6cc7ef3a8b46a0372a1d920
    baseline_data: Magpie-Align/Magpie-Pro-MT-300K-v0.1@3c3045600d578b8f37413924b1b3bf117929755e
    baseline_checkpoint: Magpie-Align/Llama-3-8B-Magpie-Align-SFT-v0.1@1ed587f54f70334f495efb9c027acb03e96fe24f
    judge: Qwen/Qwen3.5-9B@c202236235762e1c871ad0ccb60c8ee5ba337b9a
    alpaca_eval_code: tatsu-lab/alpaca_eval@cd543a149df89434d8a54582c0151c0b945c3d20
    alpaca_eval_data: tatsu-lab/alpaca_eval@2edc6fad8be6b14ea7230aabfd08188da6b8b814
    arena_hard_code: lmarena/arena-hard-auto@196f6b826783b3da7310e361a805fa36f0be83f3
    arena_hard_data: lmarena-ai/arena-hard-auto@15f3746e21432264ce9b453999bde4f3c946d2e6
    wildbench_code: allenai/WildBench@d6b8dcaf377d173d031980f97c16e1a82618c03d
    wildbench_data: allenai/WildBench@26c49eb39d7d5ce2099b0bbafed5a88dcce954ec
rules:
  - id: MH-001
    severity: hard_zero
    title: Verifier integrity
    description: Do not modify, bypass, infer hidden contents from, or interfere with root-owned verifier assets or reward handling.
  - id: MH-002
    severity: hard_zero
    title: Frozen scientific contract
    description: Do not change the student, generator, tokenizer, recipe, seed, sequence length, batch, evaluation, judge, or checkpoint identities.
  - id: MH-003
    severity: hard_zero
    title: Data provenance
    description: Use only the pinned local Magpie baseline data and pinned local generator; external corpora, APIs, downloads, and precomputed artifacts are forbidden.
  - id: MH-004
    severity: hard_zero
    title: Evaluation contamination
    description: Do not probe, reconstruct, train on, or encode behavior for hidden evaluation prompts or verifier outputs.
  - id: MH-005
    severity: hard_zero
    title: Source boundary
    description: Modify only data_research; symlinks, path escapes, sitecustomize, and source files larger than 10 MiB are forbidden.
  - id: MH-006
    severity: hard_zero
    title: Provenance completeness
    description: Record every attempt and select one completed immutable dataset before control completion.
required_outputs:
  - /app/output/dataset.jsonl
  - /app/output/dataset_manifest.json
  - /app/output/pipeline_config.toml
  - /app/output/provenance.json
  - /app/output/experiments.jsonl
  - /app/output/submission-selection.json
  - /app/output/control-complete.json
