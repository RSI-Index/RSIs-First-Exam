# Immutable Magpie SFT recipe.  The verifier replaces only the two sentinel paths.
base_model: /models/Meta-Llama-3-8B
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: false
strict: false
chat_template: llama3
datasets:
  - path: __CANONICAL_DATASET__
    type: sharegpt
    conversation: llama3
val_set_size: 0.001
output_dir: __VERIFIER_OUTPUT__
sequence_len: 8192
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 2
optimizer: paged_adamw_8bit
learning_rate: 0.00002
lr_scheduler: cosine
warmup_steps: 100
weight_decay: 0.0
bf16: auto
tf32: false
flash_attention: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
train_on_inputs: false
group_by_length: false
evals_per_epoch: 5
saves_per_epoch: 1
special_tokens:
  pad_token: <|end_of_text|>
seed: 42
save_safetensors: true
