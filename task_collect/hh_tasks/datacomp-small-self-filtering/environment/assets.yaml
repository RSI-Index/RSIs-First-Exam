# ASSET MANIFEST -- datacomp-small-self-filtering
#
# NOTHING HERE IS DOWNLOADED. Configuration only: no data, no weights, no vendored source.
#
# WHAT MAKES THIS MANIFEST DIFFERENT FROM ITS SIBLINGS. The other two packages point at immutable-
# ish artifacts behind moving refs. Here the pool is not distributed as data at all:
# download_upstream.py fetches parquet files of URLs, and img2dataset crawls the live web for the
# images. Link rot is monotone. Re-running the crawl is GUARANTEED to give a different pool -- not
# "might", guaranteed -- so the realized pool is site-local and time-local, our 12.8M is not
# anyone else's 12.8M, and the ONLY thing that makes six rounds of one chain comparable to each
# other is the uid fingerprint that fetch_assets.sh records in environment/pool.lock.yaml.
# See contract.yaml data.leaderboard_comparable, which is false and which contract_check.py
# refuses to let anyone set to true.
#
# PROVENANCE. Every path, flag and file name below is a literal from the pinned commit:
#   README.md:44,48   download_upstream.py --scale small; "small: 12.8M pool size, 12.8M examples seen"
#   README.md:54,60   "$data_dir/metadata" and "$data_dir/shards"
#   README.md:57      --download_npz adds the CLIP-feature .npz files
#   README.md:62      --skip_shards for metadata only
#   README.md:68      small scale disk: metadata 3 GB, npzs 75GB, data (tars) 450 GB
#   README.md:117     the filter baselines are "Table 3 of our paper"  <- so no numbers are in-repo
#   download_evalsets.py            the evaluation sets
#   baselines.py:86   the artifact format: a .npy of uids "in sorted binary format"
#
# UNLIKE the sibling packages, the disk figures here are UPSTREAM'S OWN (README.md:68) rather than
# our guesses. They are still not a promise about what a crawl returns today, which is what
# pool.lock.yaml is for.
#
# The next line is read by three programs with a plain text scan rather than a YAML parse
# (task-tools/asset_check.py, which must run with no pyyaml; tests/evaluate.py; and tests/test.sh
# via grep, before python starts). NO INLINE COMMENT ON IT, EVER -- in the VLM-R1 sibling a comment
# on this line made all three staging gates unable to fire.
state: NOT_STAGED

schema: rsi-assets/1
package: datacomp-small-self-filtering

train:
  - id: commonpool_metadata
    url: "https://github.com/mlfoundations/datacomp -> python download_upstream.py --scale small --data_dir $DIR"
    kind: script_resolved
    produces: "$DIR/metadata/*.parquet"
    mount: /datasets/commonpool/metadata
    revision: PENDING_DOWNLOAD
    consumed_by: [agent]
    size_upstream_stated: "3 GB (README.md:68)"
    why: >
      The parquets carry the image urls, the captions, and -- load-bearing for this task -- the
      image-text similarities from trained OpenAI CLIP models. Those precomputed scores are why the
      clip_score baseline costs ZERO GPU time, and therefore why an improver using our own carried
      checkpoint is strictly the more expensive option. See contract.yaml
      per_round_budget.tool_gpu_seconds_note.

  - id: commonpool_npz
    url: "python download_upstream.py --scale small --download_npz"
    kind: script_resolved
    produces: "$DIR/metadata/*.npz"
    mount: /datasets/commonpool/metadata
    revision: PENDING_DOWNLOAD
    consumed_by: [agent]
    size_upstream_stated: "75 GB (README.md:68)"
    optional: true
    why: >
      CLIP features per sample. Required only by the image_based and
      image_based_intersect_clip_score baselines (baselines.py:9-17), which are measured as
      reference_baselines. An agent may use them; they are part of the pool as distributed.

  - id: commonpool_shards
    url: "crawled by img2dataset from the urls inside commonpool_metadata"
    kind: web_crawl
    produces: "$DIR/shards/*.tar  (webdataset)"
    mount: /datasets/commonpool/shards
    revision: NOT_APPLICABLE
    revision_why: >
      There is no revision. The referent is the live web. This field is deliberately not
      PENDING_DOWNLOAD, because PENDING_DOWNLOAD implies a value exists to be filled in and here
      none does -- what gets recorded instead is the realized uid set, in pool.lock.yaml.
    consumed_by: [agent]
    size_upstream_stated: "450 GB (README.md:68)"
    why: THE POOL. 12.8M image-text pairs, minus whatever the crawl could not reach.

eval:
  - id: evalsets
    url: "python download_evalsets.py --output_dir $DIR"
    kind: script_resolved
    mount: /eval-data/datacomp_evalsets
    revision: PENDING_DOWNLOAD
    consumed_by: [verifier]
    why: >
      The 38 scored datasets (of 40 in tasklist.yml -- see contract.yaml
      metric.headline.the_38_vs_40_trap). VERIFIER ONLY: this path does not exist in the agent
      image, which is what makes RH-RSI-003 a mount boundary instead of a promise.
    size_guess: "UNKNOWN; upstream states no figure for the eval sets. MEASURE at staging."

code:
  - id: datacomp_source
    url: https://github.com/mlfoundations/datacomp
    kind: git
    revision: 4a8df1992566ef8334773f7152e1855b1f716162
    mount: /opt/project
    consumed_by: [agent, verifier]
    why: >
      Cloned at build time in both images and used UNPATCHED -- unlike the nanoVLM sibling, this
      task needs no adapter. tests/upstream_check.py verifies the commit and that the working tree
      is clean, so an undeclared local modification fails the build.
    size_guess: "~4 MB"

  - id: open_clip
    url: "pip install open_clip_torch (train.py:13 imports training.main.main directly)"
    kind: pip
    revision: PIN_REQUIRED
    mount: n/a
    consumed_by: [agent, verifier]
    why: >
      train.py:13 does `from training.main import main` -- it IMPORTS open_clip's internal
      training entry point rather than shelling out to a CLI, then builds an argv and calls it. That
      is a tighter coupling than a subprocess: an open_clip refactor of that module path breaks the
      trainer outright, and a change to its LR schedule or loss moves every number in the chain
      while every file here still describes the same recipe. The recipe frozen in scale_configs.py
      is only meaningful against a pinned open_clip.
    pin_note: >
      PIN_REQUIRED is a gate, not a placeholder. Both Dockerfiles declare ARG OPEN_CLIP_VERSION
      with no default so the build fails; tests/contract_check.py reports OPEN_CLIP NOT PINNED; and
      tests/test.sh gate 0 infra_fails while contract.yaml still reads PIN_REQUIRED.

must_not_stage:
  - path_pattern: "/datasets/**/datacomp_evalsets/**"
    why: >
      The evaluation sets are the metric. They belong in the verifier image only.
  - url: https://huggingface.co/datasets/mlfoundations/datacomp_1b
    why: >
      DataComp-1B is upstream's own best-performing subset of the xlarge pool (README.md,
      "Downloading DataComp-1B"). Staging it would let an agent intersect our pool with a published
      answer, and the benchmark would measure a join.
  - url_pattern: "openai/clip-vit-*"
    why: >
      NOT because using OpenAI CLIP is forbidden -- see the note below, it is not -- but because a
      checkpoint staged into the agent's mounts is an untracked scorer. The permitted route to that
      signal is the similarities and features that SHIP IN THE POOL METADATA, which are recorded in
      pool.lock.yaml and identical for every round and every arm.

boundary_note_read_this_before_calling_something_leakage: >
  Upstream's own image_based baseline selects pool images by proximity to ImageNet-1k TRAINING
  images in CLIP feature space (README.md:157), and ImageNet-1k's VALIDATION split is one of the 38
  scored datasets. That looks like leakage and is not treated as such here, for a reason worth
  stating explicitly rather than leaving to a reader's inference: it is a published baseline of the
  benchmark this task is built on, and forbidding it would make reference_baselines unrunnable and
  turn this into a different benchmark that merely resembles DataComp. The line drawn instead is
  the one that matters for a chain: the evaluation SETS themselves are never available to the
  agent, in any round, by any path. Selecting data that resembles a training distribution is data
  curation; selecting data by looking at the test set is not.

on_stage_write:
  - environment/staged.lock.yaml       # per-asset revision/digest/bytes, open_clip version
  - environment/pool.lock.yaml         # realized_uids, uid_set_sha256, download_rate, crawl date
  - "assets.yaml state: NOT_STAGED -> STAGED"
  - "contract.yaml data.realized_uids / uid_set_sha256 / download_rate, replacing PENDING_DOWNLOAD"
