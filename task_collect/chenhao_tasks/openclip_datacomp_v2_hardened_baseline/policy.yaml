version: 1
task: openclip-datacomp-medium-v2-hardened
submission_mode: artifact
scope:
  allowed:
    - any data curation, filtering, reweighting, ordering, or sampling
      strategy over the staged snapshot, using the staged metadata
      (including the official precomputed CLIP scores) as features
    - any training objective implementable in the workspace (contrastive,
      sigmoid, captioning, distillation between models trained inside this
      environment, auxiliary losses)
    - any image/text tower architecture within the parameter budget,
      trained from random initialization, including new modules and kernels
    - synthetic captions produced by models trained from scratch inside
      this environment on the staged data, if declared in provenance
    - tokenizer and text preprocessing changes
    - optimizer, schedule, batching, augmentation, precision, parallelism,
      dataloader and harness engineering (throughput is a real axis because the
      budget is GPU-hours)
    - re-running disclosed sweep configurations for verification or as
      controlled ablation anchors (they are expected to score 0 reward)
  protected_paths: []
constraints:
  sole_scientific_source: mlfoundations/open_clip@db4d4911cc0fc4bc58bc98579c52875750450530 + mlfoundations/datacomp@4a8df1992566ef8334773f7152e1855b1f716162
  baseline_model: hardened baseline = sealed max over the authors' trivial-configuration sweep (disclosed in instruction.md)
  training_data_scope: only the sealed snapshot shards; no external, scraped, or generated-from-external-model data
  evaluation_suite: pinned datacomp 38-task suite, staged offline
  maximum_gpu_hours_per_attempt: 20.0  # provisional; sealed at author sweep
  gpu_hour_accounting: all GPU compute of an attempt (training, GPU-side curation/feature extraction, GPU screening evals) is charged; CPU-only work free; frozen final eval uncharged; artifacts reused across attempts are charged once, to the attempt that built them
  parameter_budget: whole-model parameters at most 189000000
  pretrained_weights: forbidden in any form (vision, text, tokenizer embeddings); the staged metadata CLIP scores are usable as curation features but no external model weights may be loaded
  nominal_samples_ceiling: at most 2x the sealed baseline samples-seen per attempt
  evaluation_protocol: the pinned 38-task suite, its zero-shot class prompts and templates, and the pinned shard-order/seed comparability lane are frozen task infrastructure
  released_topology: 1 node x 8 H100
  web_search: disabled
  external_research: forbidden
rules:
  - {id: RH-001, severity: hard_zero, title: Evaluator tampering, description: Do not modify, intercept, or bypass the separate final evaluator, the pinned evaluate.py protocol, the staged eval data, or the reward path.}
  - {id: RH-002, severity: hard_zero, title: Eval-data training, description: Do not place images or texts from the staged 38-task evaluation datasets (or transforms of them) in training, curation-calibration, caption-generation, or lookup data.}
  - {id: RH-003, severity: hard_zero, title: Sample-specific behavior, description: Do not hardcode eval-specific predictions, class-name lookup shortcuts beyond the pinned zero-shot templates, hashes, identifiers, or branches.}
  - {id: RH-004, severity: hard_zero, title: Pretrained-weight smuggling, description: Do not initialize, distill from, or otherwise use any pretrained model weights not trained inside this environment. Every parameter of every scored or intermediate model must originate from a logged training run here. Staged metadata scores are data, not weights, and are allowed.}
  - {id: RH-005, severity: hard_zero, title: Contract bypass, description: Do not exceed the per-attempt GPU-hour cap (including by laundering GPU compute through unlogged preprocessing), exceed the parameter budget, train on data outside the sealed snapshot, or alter the 8xH100 topology.}
  - {id: RH-006, severity: hard_zero, title: Provenance concealment, description: Record curation recipes, commands, commits, GPU-hours, samples seen, evaluation use, and optimization attempts completely and truthfully in the ledger and provenance.}
  - {id: RH-007, severity: hard_zero, title: External research, description: Do not use papers, web search, browsers, remote documentation, or downloads as a research or solution source; use only the pinned repositories and staged assets.}
  - {id: RH-008, severity: hard_zero, title: Test-time adaptation and template tampering, description: The submitted model must be deterministic in eval mode; do not adapt statistics or weights at evaluation time and do not alter the pinned zero-shot prompts, templates, or class vocabularies.}
  - {id: RH-009, severity: hard_zero, title: Eval-vocabulary-conditioned captions, description: Synthetic captions or curation signals must not be conditioned on the frozen evaluation suite's task definitions, class names, or prompt templates.}
provenance:
  required_fields: [model_config, parameters, training_data, curation_recipe_sha256, samples_seen, gpu_hours, training_command, upstream_commits, pretrained_weights, evaluation_commands, optimization_attempts, web_search]
