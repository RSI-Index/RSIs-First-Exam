schema_version = "1.3"
source = "facebookresearch/dinov3@6876159a11b4df116f30f667f8c9888617df0751"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = [
    "*/wandb", "*/wandb/*",
    "*/hf-cache", "*/hf-cache/*",
  ] },
]

[task]
name = "scale-autoresearch/dinov3-imagenet-semdense"
description = "Beat DINOv3's own single-stage ImageNet-1k recipe on semantic (IN1k k-NN + linear) AND dense (ADE20k linear seg + NYUv2 linear depth) quality simultaneously, at a matched training GPU-hour budget on the released 4x8 H100 topology; the scored metric is a no-regression-floored geometric mean of baseline-relative probe ratios."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["dinov3", "self-supervised", "vision-encoder", "imagenet", "dense-prediction", "segmentation", "depth", "gram-anchoring"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "6876159a11b4df116f30f667f8c9888617df0751"
license = "DINOv3 License (custom Meta license; redistribution allowed under same agreement; derived weights inherit it)"

[metadata.optimization]
metric = "composite G = geomean(knn/B_knn, linear/B_linear, miou/B_miou, B_rmse/rmse) over the four frozen probes, with a 0.98 per-probe no-regression floor"
direction = "higher"
submission_mode = "artifact"
scope = "SSL objective (DINO/iBOT/KoLeo stack, centering, temperatures, EMA, masking, new auxiliary losses incl. gram-style dense regularization from own-run teachers), backbone architecture within the parameter budget (RoPE, storage/register tokens, patch size, norms, new modules, new named configs), optimizer, schedules, batch shape, crops/augmentation, precision, data ordering, seed, and train.py; frozen are the staged label-free IN1k corpus, the GPU-hour cap, the 4x8 topology, the backbone parameter budget, the backbone feature-API contract, and the four-probe evaluator"

[metadata.science]
headline = "Train a self-supervised encoder that improves global-semantic and dense-prediction quality at the same time over DINOv3's own ImageNet-1k recipe, at matched compute."
guiding_question = "Which mechanisms in the DINO+iBOT+KoLeo stack carry semantic vs dense quality, and can the global-vs-dense tension (the reason gram anchoring exists at 7B scale) be resolved at IN1k scale? Single-line ablation toggles (koleo off, ibot off, registers on, gram from own history) are the attribution anchors; the scored deliverable is the best submitted backbone."

[metadata.fidelity]
reference = "pinned facebookresearch/dinov3 public repository only"
baseline = "unchanged dinov3/configs/train/vitl_im1k_lin834.yaml (ViT-L/16, 100 epochs, batch 2048, 32 ranks) on staged ImageNet-1k"
non_repository_inputs = "none for scientific design; H100 SKU, container, offline data staging, launcher translation, submit wrapper, frozen probe recipes, verifier, and reward are task infrastructure. NOTE: budget expressed as fixed GPU-hours (author decision); README's known ImageNet22k-path bug in the fast-setup command is corrected in the staged launcher, not in the source."

[metadata.baseline]
method = "task-pristine pinned config vitl_im1k_lin834.yaml under this exact contract"
score_status = "provisional_values_pending_author_reproduction"
provisional_note = "knn/linear below are the pinned config's own header numbers (82.2/83.3; README states 82.0/83.5). ADE20k mIoU and NYUv2 RMSE are rough ESTIMATES — no published number exists for this exact config. The authors run the pristine config once before release (this run also settles upstream issue #309, an unresolved third-party reproduction failure of this config); all values, the probe-noise band, the screening-anchor table, and the GPU-hour cap are sealed from that run."
reference_run = "pending"
parameters = 300000000            # ~ViT-L/16 backbone; exact count sealed at reproduction
parameter_budget = 307000000      # ~1.02x pristine; author-review knob
training_gpu_hours_cap = 450.0    # provisional; README 32 H100 x ~14h; final = measured wall x 32
images_seen = 128000000           # 100 ep x 1.28M; nominal ceiling per attempt = 2x this
knn_top1 = 0.822                  # provisional (config header)
linear_top1 = 0.833               # provisional (config header)
ade20k_miou = 0.40                # provisional ESTIMATE
nyu_rmse = 0.45                   # provisional ESTIMATE (lower better)
reward = 0.0                      # G = 1.0 at baseline by construction

[metadata.reward]
formula = "r = (knn/B_knn, linear/B_linear, miou/B_miou, B_rmse/rmse); G = geomean(r); reward = 0 if min(r) < 0.98 else clip((G - 1)/(G_ref - 1), 0, 1)"
G_ref = 1.03  # provisional; re-placed outside the measured probe-noise band at sealing (env DINO_G_REF)
floor = 0.98  # provisional; same treatment (env DINO_FLOOR)

[metadata.run_contract]
full_run_gpus = 32
agent_trajectories = 1
web_search = "disabled"
hard_network_isolation = true
scientific_budget = "at most 450.0 (provisional) H100-hours of GPU compute per candidate attempt on 4x8 ranks; all GPU work of an attempt charged; CPU-only work free; frozen final eval uncharged; nominal images-seen ceiling 2x baseline"
topology_mapping = "released 4x8-GPU topology retained exactly; only the launch layer is translated (/task-tools/launch_dinov3_4x8.sh); /task-tools/dinov3_async_run.py enforces the GPU-hour cap with a watchdog hard kill"
measured_single_run = "pending author reproduction (README-derived estimate: ~14 h wall on 32 H100)"
default_agent_session = "async submit wrapper; 30-minute status.json polling with the agent offline; interrupted runs resume in place from the trainer's own checkpointing with identical data order; judge resumed attempts by real status/checkpoint/log evidence"

[agent]
network_mode = "none"

[environment]
network_mode = "none"
docker_image = "scale-autoresearch/dinov3-semdense-environment:v1"
build_timeout_sec = 10800
cpus = 32
memory_mb = 524288
storage_mb = 1048576  # ~1 TB: IN1k + ADE20k + NYUv2 + workspace + checkpoints
gpus = 32
gpu_types = ["H100"]

[environment.env]
WANDB_MODE = "offline"
DINO_GPU_HOURS_CAP = "450.0"
DINO_TOPOLOGY_GPUS = "32"
DINO_IMAGENET_DIR = "/datasets/imagenet-1k"
DINO_ADE20K_DIR = "/datasets/ade20k"
DINO_NYU_DIR = "/datasets/nyu-depth-v2"

[verifier]
timeout_sec = 28800
environment_mode = "separate"
network_mode = "none"

[verifier.environment]
network_mode = "none"
docker_image = "scale-autoresearch/dinov3-semdense-tests:v1"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 524288
gpus = 8
gpu_types = ["H100"]

[verifier.environment.env]
WANDB_MODE = "offline"
DINO_IMAGENET_DIR = "/datasets/imagenet-1k"
DINO_ADE20K_DIR = "/datasets/ade20k"
DINO_NYU_DIR = "/datasets/nyu-depth-v2"
DINO_PARAM_BUDGET = "307000000"
DINO_B_KNN = "0.822"
DINO_B_LINEAR = "0.833"
DINO_B_MIOU = "0.40"
DINO_B_RMSE = "0.45"
DINO_G_REF = "1.03"
DINO_FLOOR = "0.98"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
