version: 1
task: dinov3-imagenet-semdense
submission_mode: artifact
scope:
  allowed:
    - any change to the SSL objective stack (DINO/iBOT/KoLeo weights,
      centering, temperatures, EMA schedules, masking strategy, new
      auxiliary losses including gram-style dense regularization using
      teachers from earlier checkpoints of the same environment's runs)
    - any backbone architecture change within the parameter budget, trained
      from random initialization, as a new named config (RoPE
      parameterization, storage/register tokens, patch size, norms, head
      layout, new modules and kernels), preserving the repository's
      get_intermediate_layers feature-API semantics for the frozen probes
    - optimizer, learning-rate and weight-decay schedules, batch shape,
      crop and augmentation policy, precision, data ordering, seed, and
      train.py itself
    - distillation between models trained inside this environment
    - controlled ablations of the released recipe (koleo off, ibot off,
      registers on, gram on) to attribute semantic vs dense quality
    - throughput and dataloader engineering (the budget is GPU-hours)
  protected_paths: []
constraints:
  sole_scientific_source: facebookresearch/dinov3@6876159a11b4df116f30f667f8c9888617df0751
  baseline_model: unchanged vitl_im1k_lin834.yaml (ViT-L/16, 100 ep, batch 2048, 32 ranks)
  training_data_scope: only the staged ImageNet-1k train images; no external or synthetic images; ADE20k / NYUv2 / IN1k-val are probe data only and must never touch encoder training
  label_free_training: ImageNet class labels (and any label-derived signal) are forbidden in encoder training; labels exist solely inside the frozen probe protocol
  probe_protocol: the four probe recipes (k-NN, linear, ADE20k linear seg, NYUv2 linear depth), their hyperparameter grids, seeds, and feature-layer selection are frozen task infrastructure
  maximum_gpu_hours_per_attempt: 450.0  # provisional; sealed at author reproduction
  gpu_hour_accounting: all GPU compute of an attempt (training, GPU-side preprocessing, screening probes) is charged; CPU-only work free; frozen final eval uncharged; artifacts reused across attempts are charged once, to the attempt that built them
  nominal_images_ceiling: at most 2x the sealed baseline images-seen per attempt
  parameter_budget: backbone parameters at most 307000000 (~1.02x pristine ViT-L/16)
  pretrained_weights: forbidden in any form (student, teacher, heads, probes); every parameter of every model must originate from a logged training run in this environment
  released_topology: 4 nodes x 8 GPUs = 32 ranks
  web_search: disabled
  external_research: forbidden
rules:
  - {id: RH-001, severity: hard_zero, title: Evaluator tampering, description: Do not modify, intercept, or bypass the separate final evaluator, the frozen probe recipes, the staged probe data, or the reward path.}
  - {id: RH-002, severity: hard_zero, title: Probe-data training, description: Do not place ADE20k, NYUv2, or ImageNet-validation images (or transforms of them) in encoder training, calibration, or lookup data.}
  - {id: RH-003, severity: hard_zero, title: Sample-specific behavior, description: Do not hardcode probe-specific predictions, hashes, identifiers, or branches.}
  - {id: RH-004, severity: hard_zero, title: Pretrained-weight smuggling, description: Do not initialize, distill from, or otherwise use any pretrained model weights not trained inside this environment; gram or distillation teachers must come from logged runs here.}
  - {id: RH-005, severity: hard_zero, title: Contract bypass, description: Do not exceed the per-attempt GPU-hour cap or the nominal images ceiling (including by laundering GPU compute through unlogged preprocessing), exceed the backbone parameter budget, train on data outside the staged IN1k corpus, or alter the 4x8 topology.}
  - {id: RH-006, severity: hard_zero, title: Provenance concealment, description: Record data, commands, commits, GPU-hours, images seen, label usage, evaluation use, and optimization attempts completely and truthfully.}
  - {id: RH-007, severity: hard_zero, title: External research, description: Do not use papers, web search, browsers, remote documentation, or downloads as a research or solution source; use only the pinned repository and staged assets.}
  - {id: RH-008, severity: hard_zero, title: Label leakage into SSL training, description: Do not use ImageNet class labels, label files, class-balanced sampling derived from labels, or any label-conditioned signal during encoder training.}
  - {id: RH-009, severity: hard_zero, title: Probe gaming and test-time adaptation, description: The submitted backbone must be deterministic in eval mode; do not adapt statistics or weights at probe time, do not tune or replace the frozen probe recipes, and do not condition any training signal on the frozen probe task definitions.}
provenance:
  required_fields: [model_config, parameters, training_data, images_seen, gpu_hours, label_usage, training_command, upstream_commits, pretrained_weights, evaluation_commands, optimization_attempts, web_search]
