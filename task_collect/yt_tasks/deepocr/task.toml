schema_version = "1.3"
source = "Princeton-AI2-Lab/DeepOCR@cd49a8f6129689cbda94c8cb25cfd128ab69b1f6"
artifacts = ["/app/project", "/app/output"]

[task]
name = "scale-autoresearch/deepocr-optical-compression"
description = "Improve DeepOCR Stage-2 OCR quality versus visual-token cost using the official VILA reproduction."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["deepocr", "ocr", "optical-compression", "multimodal-training"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "cd49a8f6129689cbda94c8cb25cfd128ab69b1f6"

[metadata.optimization]
metric = "public OmniDocBench normalized edit distance and visual-token Pareto"
direction = "higher"
submission_mode = "artifact"
scope = "DeepOCR projector, compressor, tiling, sampling/weighting within the fixed Stage-2 records, and training hyperparameters"

[metadata.fidelity]
reference = "Princeton-AI2-Lab DeepOCR public reproduction, not the DeepSeek-OCR training setup"
paper_alignment = "optical-compression research question and OmniDocBench family only"
environment_adaptations = "lazy PS3 import, private-/lustre-to-read-only-staged-path resolution, Slurm-to-explicit-single-node-8-GPU launcher compatibility, public-only OmniDocBench, trusted visual-token meter, and custom scalar reward"

[metadata.baseline]
method = "pkulium/easy_deepocr under the same pinned DeepOCR/OmniDocBench loader and token meter"
score_status = "current-patch one-page offline author smoke passed; it is not the full public baseline or a matched 100-step training baseline"

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks"
full_run_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/full_runs/deepocr"
full_run_gpus = 8
agent_trajectories = 1
agent_timeout_seconds = 21600
web_search = "disabled"
hard_network_isolation = false
scientific_budget = "report qualification lane: 100 Stage-2 optimizer steps per candidate; every train-and-score candidate is one recorded optimization attempt"
current_scientific_status = "official inference and OmniDoc metrics are real, but hidden documents and the report's olmOCR-bench hard gate are not implemented"

[agent]
timeout_sec = 21600
network_mode = "public"

[environment]
# Apptainer cannot enforce no-network. The full-run launcher disables Codex
# web search and the policy forbids external research; model API traffic remains.
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/deepocr-environment.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 307200
gpus = 8
gpu_types = ["H100"]

[environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
NNODES = "1"
NODE_RANK = "0"
GPUS_PER_NODE = "8"
MASTER_ADDR = "127.0.0.1"
MASTER_PORT = "25001"
DEEP_OCR_VISION_TOWER = "/root/.cache/huggingface/hub/models--pkulium--sam_clip_ckpt/snapshots/ff2becef5c02580c7571dc1ef07627df287bcbeb/model-00001-of-000001.safetensors"

[verifier]
timeout_sec = 21600
environment_mode = "separate"
network_mode = "public"

[verifier.environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/deepocr-tests.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 307200
gpus = 8
gpu_types = ["H100"]

[verifier.environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
NNODES = "1"
NODE_RANK = "0"
GPUS_PER_NODE = "8"
MASTER_ADDR = "127.0.0.1"
MASTER_PORT = "25001"
DEEP_OCR_VISION_TOWER = "/root/.cache/huggingface/hub/models--pkulium--sam_clip_ckpt/snapshots/ff2becef5c02580c7571dc1ef07627df287bcbeb/model-00001-of-000001.safetensors"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
