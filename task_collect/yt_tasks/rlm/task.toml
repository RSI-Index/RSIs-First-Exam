schema_version = "1.3"
source = "alexzhang13/rlm@72d6940142ddfb84ee6be573dc999a37e633e671"
artifacts = ["/app/project", "/app/output"]

[task]
name = "scale-autoresearch/rlm-oolong-orchestrator"
description = "Improve the pinned RLM repository's root-policy/orchestrator over the frozen released adapter under its fixed 50-row OOLONG evaluation contract."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["rlm", "recursive-language-model", "orchestrator", "long-context", "oolong"]

[metadata]
difficulty = "hard"
category = "inference-policy"
upstream_commit = "72d6940142ddfb84ee6be573dc999a37e633e671"
base_model_revision = "0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe"
released_adapter = "mit-oasys/rlm-qwen3-30b-a3b-v0.1"
released_adapter_revision = "7d72253525f47b1a8c3c4e1059ff88e40232dd2f"

[metadata.optimization]
metric = "mean verifier-recomputed raw OOLONG reward over 5 independent rollouts of each fixed row (250 pooled rollouts)"
direction = "higher"
submission_mode = "workspace"
scope = "root-policy/orchestrator prompt and harness code: prompts, REPL bootstrap and helpers, context chunking/indexing, sub-call batching and routing, aggregation, budget management, answer formatting — everything except the frozen judge layer"

[metadata.fidelity]
reference = "released adapter mit-oasys/rlm-qwen3-30b-a3b-v0.1 served per its README TP4 vLLM command, evaluated by the repository OOLONG trec_coarse@131072 raw scorer"
repository_baseline = "unchanged repository default orchestrator (RLM system prompt + ORCHESTRATOR_ADDENDUM) over the frozen adapter; complete 50-row filtered validation selection, seed 42"
environment_adaptations = "immutable offline model/data revisions, local-path OOLONG Parquet, a disclosed 1800-second outer per-rollout timeout applied identically to baseline and candidates, two identical TP4 serving workers, a bounded work-conserving rolling pool with at most 50 active rollouts per worker, and an identity scalar mapping of raw OOLONG reward"

[metadata.baseline]
method = "released adapter + repository default orchestrator, zero optimization attempts; LSF job 267451, run 20260720T154236Z-released-adapter-default-orchestrator-r1"
score_status = "Historical calibration over 7 identical single runs (r1 job 267451 + LSF 299749-299754): reward 0.18-0.46, mean 0.34, std 0.09; per-row 11/50 always ~zero, 0/50 always correct, 39/50 stochastic under the server-default temperature. Current matched pooled qualification job 304037 scored 0.257183 over 250/250 rollouts (five per row), with per-repeat rewards [0.220018, 0.220000, 0.305900, 0.260000, 0.280000], 11 timeouts, 0 errors, and 0 reported-reward mismatches. This pooled qualification is the active baseline."

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks"
full_run_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/full_runs/rlm"
full_run_gpus = 8
agent_trajectories = 1
agent_timeout_seconds = 0  # uncapped calibration run: SOP step 6 sets budgets from this run's measured time
web_search = "disabled"
hard_network_isolation = false
scientific_budget = "one decision-relevant experiment evaluates one frozen policy with 5 independent stochastic rollouts of every row in the complete 50-row trec_coarse@131072 selection (seed 42, 250 total, 1800-second per-rollout cutoff), using two TP4 workers and a bounded rolling pool of at most 50 active rollouts per worker; qualification measured 43m21s for evaluation and 56m50s for the complete hardened verifier job"
current_scientific_status = "Released-adapter orchestrator task is active; the earlier 60-update on-policy training candidate is retired. Seven historical single-run calibrations measured std 0.09. Pooled verifier qualification job 304037 is PASS: 250/250 rollouts, reward 0.257183, worker allocation 3+2, 11 timeouts retained in the denominator, 0 errors, 0 reward mismatches, hardened gold isolation true, policy gate PASS. Agent-side and final evaluation use the same frozen pooled schedule."

[agent]
# No session cap for the calibration run; per-command exec timeout is set by the launcher.
network_mode = "public"

[environment]
# Apptainer cannot enforce no-network. The full-run launcher disables Codex
# web search and the policy forbids external research; model API traffic remains.
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/rlm-environment.sif"
build_timeout_sec = 10800
cpus = 64
memory_mb = 524288
storage_mb = 409600
gpus = 8
gpu_types = ["H100"]

[environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
OOLONG_DATASET_PATH = "/root/.cache/huggingface/hub/datasets--oolongbench--oolong-synth/snapshots/f0d59eaf0febf130664cfceb710436c8e3216b2b"

[verifier]
timeout_sec = 21600
environment_mode = "separate"
network_mode = "public"

[verifier.environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/rlm-tests.sif"
build_timeout_sec = 10800
cpus = 64
memory_mb = 524288
storage_mb = 409600
gpus = 8
gpu_types = ["H100"]

[verifier.environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
OOLONG_DATASET_PATH = "/root/.cache/huggingface/hub/datasets--oolongbench--oolong-synth/snapshots/f0d59eaf0febf130664cfceb710436c8e3216b2b"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
