schema_version = "1.3"
source = "PythonNut/superbpe@bbd09768fc28a875cef48e6bdd66e3a17454628e + alisawuffles/tokenizers-superbpe@757f2a55c0820ed47064e1fe473deea39b7b611b"
artifacts = ["/app/project", "/app/output"]

[task]
name = "scale-autoresearch/superbpe-encoding-efficiency"
description = "Improve lossless held-out bytes per token over the released SuperBPE t80 tokenizer at a fixed 200K BPE vocabulary and the repository's exact 10GB tokenizer-training corpus."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["superbpe", "tokenization", "bpe", "compression", "encoding-efficiency"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "bbd09768fc28a875cef48e6bdd66e3a17454628e"
tokenizers_submodule_commit = "757f2a55c0820ed47064e1fe473deea39b7b611b"
dataset_revision = "64b9a7c502482035602810c4e9acda1c1dd21908"
license = "MIT (main repository); Apache-2.0 (tokenizers fork)"

[metadata.optimization]
metric = "lossless bytes per token on pinned UW/olmo-mix-1124-subset-p99 eval/135.txt"
direction = "higher"
submission_mode = "artifact"
scope = "tokenizer-learning method and implementation: merge objective/scoring, boundary schedule and transition point, pretokenization, corpus ordering/weighting within the fixed corpus, and Python/Rust implementation; frozen are the exact staged training corpus, 10GB data budget, 200K base BPE vocabulary, five released added tokens, deterministic lossless encoding, and hidden evaluator"

[metadata.science]
headline = "Design a 200K lossless BPE tokenizer that compresses held-out text better than the released SuperBPE t80 tokenizer under the same public 10GB corpus."
guiding_question = "Which learned boundary relaxation or merge-allocation strategy improves held-out bytes per token without relying on held-out text or increasing the vocabulary?"

[metadata.fidelity]
reference = "pinned PythonNut/superbpe public repository and its pinned tokenizers-superbpe submodule only"
baseline = "released olmo2_p99_truncate_10G_80K_extend_200K_mw4_colon tokenizer artifact"
non_repository_inputs = "Python/Rust/container dependency pins, public-dataset path translation, an exact prefix materialization of train/70.txt, memory-safe token counting, hidden evaluation, policy gate, and scalar reward are task infrastructure"

[metadata.baseline]
method = "released t80 tokenizer artifact evaluated on the pinned current public eval/135.txt"
score_status = "complete immutable current-environment reference"
