version = "1.0"

[task]
name = "ale/olmo3-7b-zero-rl-math"
description = "RLVR from Olmo-3-7B base with OlmoRL on Dolci-RL-Zero-Math via open-instruct (Olmo 3 §6, Table 49)"
authors = []
keywords = ["math", "post-training", "rlvr", "grpo", "olmorl", "rl-zero", "olmo3"]

[metadata]
difficulty = "hard"
category = "machine_learning"
tags = ["math", "post-training", "reinforcement-learning", "rlvr", "grpo", "olmorl", "rl-zero", "7B", "open-instruct"]

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 172800.0

[environment]
# Olmo 3 report Table 49 (7B RL-Zero): 8 learner GPUs + 64 actor GPUs = 72 H100 total,
# disaggregated actor/learner (GPUs per actor TP=1).
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/posttrain-olmo3-environment.sif"
build_timeout_sec = 1800.0
cpus = 256
memory_mb = 2621440
storage_mb = 4194304
gpus = 72

[environment.env]
HF_HOME = "/app/hf-cache"
HF_HUB_ENABLE_HF_TRANSFER = "1"
WANDB_MODE = "offline"
