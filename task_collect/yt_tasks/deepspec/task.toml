schema_version = "1.3"
source = "deepseek-ai/DeepSpec@005e03b81cec38b7da6399833d609ee89a2587f2"
artifacts = ["/app/project", "/app/output"]

[task]
name = "scale-autoresearch/deepspec-dspark-scheduling"
description = "Improve DSpark speculative-decoding efficiency while preserving the fixed target model's verification semantics."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["deepspec", "dspark", "speculative-decoding", "serving"]

[metadata]
difficulty = "hard"
category = "system_optimization"
upstream_commit = "005e03b81cec38b7da6399833d609ee89a2587f2"

[metadata.optimization]
metric = "timed official DSpark decode goodput with complete in-path target-verification gate"
direction = "higher"
submission_mode = "workspace"
scope = "confidence scheduling and proposal/verification policy; target and draft weights fixed"

[metadata.fidelity]
reference = "official DeepSpec commit and released Qwen3-4B DSpark checkpoint"
paper_alignment = "official model pair and decode implementation; the paper's Table 1 uses nine tasks, temperature 1.0, and disables confidence scheduling"
environment_adaptations = "five-task temperature-0 timed lane, custom complete audit of the official cached target-verification path plus 20 diagnostic independent-greedy samples, four H100s, and custom goodput reward"

[metadata.baseline]
method = "pristine pinned DSpark workspace with the same verifier image and hardware allocation"
score_status = "one full current-env qualification baseline measured on four H100s (job 221609); repeated matched baselines are still required before scientific comparison"

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks"
full_run_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/full_runs/deepspec"
full_run_gpus = 4
agent_trajectories = 1
agent_timeout_seconds = 21600
web_search = "disabled"
hard_network_isolation = false
scientific_budget = "fixed-weight scheduling search within 6h; every measured profile or A/B candidate is one recorded optimization attempt"
current_scientific_status = "mechanism-valid public benchmark, but not the report's sealed-trace SLO/P50/P99 serving experiment"

[agent]
timeout_sec = 21600
network_mode = "public"

[environment]
# Apptainer cannot enforce no-network. The full-run launcher disables Codex
# web search and the policy forbids external research; model API traffic remains.
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/deepspec-environment.sif"
build_timeout_sec = 7200
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 4
gpu_types = ["H100"]

[environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"

[verifier]
timeout_sec = 14400
environment_mode = "separate"
network_mode = "public"

[verifier.environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/deepspec-tests.sif"
build_timeout_sec = 7200
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 4
gpu_types = ["H100"]

[verifier.environment.env]
HF_HOME = "/root/.cache/huggingface"
HF_DATASETS_CACHE = "/tmp/hf-datasets-cache"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
