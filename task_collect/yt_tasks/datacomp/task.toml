schema_version = "1.3"
source = "mlfoundations/datacomp@4a8df1992566ef8334773f7152e1855b1f716162"
artifacts = ["/app/project", "/app/output"]

[task]
name = "scale-autoresearch/datacomp-small-filtering"
description = "Design a CommonPool data-curation method whose UID subset improves the official DataComp small-scale 38-task average under frozen ViT-B/32 training."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["datacomp", "data-curation", "clip", "multimodal", "pretraining", "filtering"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "4a8df1992566ef8334773f7152e1855b1f716162"
license = "MIT"

[metadata.optimization]
metric = "official DataComp aggregate Average over 38 non-null task metrics"
direction = "higher"
submission_mode = "artifact"
scope = "data curation over the sealed successful small CommonPool: representations, quality/alignment, coverage/diversity, clustering, deduplication, joint or multi-stage selection, and auxiliary curation models; frozen are original records, ViT-B/32, small scale recipe, nominal 12.8M examples seen, seed 0, uniform resampling, evaluator, and aggregation"

[metadata.science]
headline = "Improve broad multimodal transfer through data selection alone at fixed model and training budget."
guiding_question = "Which measurable properties of image-caption pairs and of the selected set produce broad transfer rather than gains on only one benchmark group?"

[metadata.fidelity]
reference = "pinned mlfoundations/datacomp public repository only"
baseline = "repository L/14 CLIP-score top-30-percent filter, intersected with the sealed locally successful crawl, then frozen official small training and evaluation"
non_repository_inputs = "none for scientific design; H100-compatible PyTorch/CUDA base, pinned metadata/evaluation revisions, successful-crawl sealing, GPFS paths, LSF/Apptainer launch, verifier, and raw-average reward are task infrastructure"

[metadata.baseline]
method = "official baselines.py clip_score --arch l14 --fraction 0.3 on the pinned small metadata, intersected with available_uids.npy"
score_status = "unmeasured until SOP step-4 pristine reference completes"

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks"
data_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/data/datacomp/small"
full_run_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/full_runs/datacomp"
full_run_gpus = 16
full_run_topology = "2 nodes x 8 H100; 16 DDP ranks for training and 16 independent one-GPU workers for the canonical evaluation task list"
agent_trajectories = 1
agent_timeout_seconds = 21600
web_search = "disabled"
hard_network_isolation = false
scientific_budget = "one frozen small-scale ViT-B/32 training run per completed candidate: nominal 12,800,000 examples seen with repository batch/LR/warmup/default precision and seed 0"
current_scientific_status = "asset staging and pristine local reference in progress"
large_asset_policy = "all CommonPool metadata/features/images, evaluation payloads, reference data, checkpoints, and logs live under asset_root; none are stored in the source checkout or home workspace"

[agent]
timeout_sec = 21600
network_mode = "public"

[environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/datacomp-environment.sif"
build_timeout_sec = 10800
cpus = 64
memory_mb = 524288
storage_mb = 614400
gpus = 16
gpu_types = ["H100"]

[environment.env]
DATACOMP_ROOT = "/datasets/datacomp/small"
DATACOMP_METADATA_DIR = "/datasets/datacomp/small/commonpool/metadata"
DATACOMP_SHARD_DIR = "/datasets/datacomp/small/commonpool/shards"
DATACOMP_AVAILABLE_UIDS = "/datasets/datacomp/small/manifests/available_uids.npy"
DATACOMP_EVAL_DIR = "/datasets/datacomp/small/eval"
HF_HOME = "/datasets/datacomp/small/eval/hf_cache"
HF_DATASETS_CACHE = "/datasets/datacomp/small/eval/hf_cache"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
TOKENIZERS_PARALLELISM = "false"

[verifier]
timeout_sec = 21600
environment_mode = "separate"
network_mode = "public"

[verifier.environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/datacomp-tests.sif"
build_timeout_sec = 10800
cpus = 64
memory_mb = 524288
storage_mb = 614400
gpus = 16
gpu_types = ["H100"]

[verifier.environment.env]
DATACOMP_ROOT = "/datasets/datacomp/small"
DATACOMP_METADATA_DIR = "/datasets/datacomp/small/commonpool/metadata"
DATACOMP_SHARD_DIR = "/datasets/datacomp/small/commonpool/shards"
DATACOMP_AVAILABLE_UIDS = "/datasets/datacomp/small/manifests/available_uids.npy"
DATACOMP_EVAL_DIR = "/datasets/datacomp/small/eval"
HF_HOME = "/datasets/datacomp/small/eval/hf_cache"
HF_DATASETS_CACHE = "/datasets/datacomp/small/eval/hf_cache"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
WANDB_MODE = "offline"
TOKENIZERS_PARALLELISM = "false"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
