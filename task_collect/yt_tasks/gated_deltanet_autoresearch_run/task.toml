schema_version = "1.3"
source = "NVlabs/GatedDeltaNet@b53d6d3a161267432a79c1c04af69fa52bddc921"
artifacts = [
  "/app/project",
  { source = "/app/output", exclude = [
    "*/wandb", "*/wandb/*",
    "*/triton", "*/triton/*",
    "*/hf-cache", "*/hf-cache/*",
  ] },
]

[task]
name = "scale-autoresearch/gated-deltanet-fixed-time-autoresearch"
description = "Cumulative mechanism-first autoresearch over Gated DeltaNet under a fixed 20-minute, 32-H100 training clock."
authors = [{ name = "Scale AutoResearch" }]
keywords = ["gated-deltanet", "autoresearch", "fixed-time", "architecture", "mechanism", "pretraining"]

[metadata]
difficulty = "hard"
category = "model_development"
upstream_commit = "b53d6d3a161267432a79c1c04af69fa52bddc921"
license = "NVIDIA Source Code License-NC"

[metadata.optimization]
metric = "geometric mean of frozen val_ppl@1x (2048) and val_ppl@2x (4096) after 1200 measured training seconds"
direction = "lower"
submission_mode = "artifact"
scope = "pretrain.py and lit_gpt/**; model size, architecture, recipe and throughput compete under one fixed hardware-local training clock"

[metadata.science]
headline = "Use controlled mechanism probes, then synthesize a faster/better Gated DeltaNet design under a fixed training-time budget."
guiding_question = "Which H1 mechanisms improve quality per unit wall-clock compute, and can their measured effects be combined without losing throughput?"
minimum_program = "live baseline, at least two mechanism probes before synthesis, at least two synthesis runs, at least five valid experiments total"
claim_boundary = "results compare commits only on the supplied 4x8 H100 platform; they are not matched-token, matched-parameter or cross-platform claims"
budget_rationale = "five 1200-second attempts consume 53.33 training GPU-hours, approximately one measured pristine 15B run (54.07 training GPU-hours from 6082.90 seconds on 32 H100s)"

[metadata.fidelity]
reference = "Karpathy autoresearch-style fixed-time cumulative loop adapted to the pinned NVlabs/GatedDeltaNet repository"
baseline = "GatedDeltaNet_H1_0.4B, established live as experiment 000-baseline on the supplied platform"
immutable_science = "staged train/validation split, vocabulary/tokenizer, sequence length, 4x8 topology, 1200-second measured clock, final evaluator"
task_baseline_commit = "f13c92929221e011324f40aebdd2d436175a5949"

[metadata.run_contract]
asset_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks"
full_run_root = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/full_runs/gated_deltanet_autoresearch"
full_run_gpus = 32
agent_trajectories = 1
web_search = "disabled"
hard_network_isolation = false
scientific_budget = "1200 measured training seconds per attempt on exactly 32 H100s; 10 cold-compile warm-up iterations and final evaluation/save excluded"
agent_session = "uncapped outer research session; each experiment is asynchronous and resumable, and task completion requires at least five valid experiments"
ledger = "results.tsv records training seconds, end-to-end wall seconds, GPU count, GPU-hours, tokens, parameters, memory, metric and keep/discard/crash decision"

[agent]
network_mode = "public"

[environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/gated_deltanet-environment.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 524288
storage_mb = 204800
gpus = 32
gpu_types = ["H100"]

[environment.env]
WANDB_MODE = "offline"
SLURM_NNODES = "4"
GDN_TRAIN_DATA_DIR = "/datasets/gated_deltanet-official/slimpajama/packed/slim"
GDN_VALIDATION_DATA_DIR = "/datasets/gated_deltanet-official/slimpajama/packed/slim"
GDN_FIXED_TRAIN_SECONDS = "1200"

[verifier]
timeout_sec = 14400
environment_mode = "separate"
network_mode = "public"

[verifier.environment]
network_mode = "public"
docker_image = "/proj/datasets/interns/yuetai/agent_envs/scale_autoresearch_tasks/images/gated_deltanet-tests.sif"
build_timeout_sec = 10800
cpus = 32
memory_mb = 262144
storage_mb = 204800
gpus = 32
gpu_types = ["H100"]

[verifier.environment.env]
WANDB_MODE = "offline"
SLURM_NNODES = "4"
GDN_VALIDATION_DATA_DIR = "/datasets/gated_deltanet-official/slimpajama/packed/slim"
GDN_EVAL_ITERS = "15"

[verifier.env]
POLICY_JUDGE_MODEL = "${POLICY_JUDGE_MODEL}"
POLICY_JUDGE_MODEL_SECONDARY = "${POLICY_JUDGE_MODEL_SECONDARY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
GOOGLE_API_KEY = "${GOOGLE_API_KEY:-}"
