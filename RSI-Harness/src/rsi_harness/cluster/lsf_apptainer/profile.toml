# Set RSI_CLUSTER_ROOT to an absolute shared directory visible to all nodes.
# Set RSI_LSF_GROUP to your scheduler account/group; USER identifies job ownership.
name = "lsf-apptainer"
adapter = "lsf-apptainer"
owner = "${USER}"

[scheduler]
kind = "lsf"
submit_binary = "bsub"
status_binary = "bjobs"
cancel_binary = "bkill"
remote_binary = "blaunch"
remote_host_flag = "-z"
queue = "normal"
group = "${RSI_LSF_GROUP}"
exclusive = true
poll_seconds = 10.0

[storage]
run_root = "${RSI_CLUSTER_ROOT}/runs"
image_cache = "${RSI_CLUSTER_ROOT}/images"
logs_root = "${RSI_CLUSTER_ROOT}/logs"
hf_home = "${RSI_CLUSTER_ROOT}/hf-home"
hf_datasets_cache = "${RSI_CLUSTER_ROOT}/hf-datasets-cache"

[builder]
binary = "/usr/bin/podman"
cpu_slots = 64
memory_mb = 524288
walltime = "02:00"
temp_root = "/tmp"
min_tmp_mb = 71680
rootless_apt_sandbox = true
# An external profile may set faked_binary and fakeroot_library together.

[apptainer]
binary = "/usr/bin/apptainer"
dns_bind = "/etc/resolv.conf"
# Data access is opt-in. Define only the required phase-scoped binds in your
# external profile, keeping evaluation-only assets out of Work.
extra_binds = []
work_binds = []
judge_binds = []
judge_authority_root = "${RSI_CLUSTER_ROOT}/authority"
build_args = ["--fakeroot"]
workspace_target = "/testbed"
temp_root = "/tmp"
container_python = "/opt/venv/bin/python"
rdma_binds = ["/dev/infiniband", "/sys/class/infiniband"]

[apptainer.environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[apptainer.work_environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[apptainer.judge_environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[resources]
min_cpu_slots = 8
min_memory_mb = 65536
min_runtime_tmp_mb = 71680
gpus_per_node = 8
walltime_margin_seconds = 900
